# Danh mục xét nghiệm + từ vựng kết quả — nguồn TẤT ĐỊNH cho `stages/labtest.py`.
#
# ★ VÌ SAO CÓ FILE NÀY
# Nhánh XÉT NGHIỆM là chỗ mất điểm lớn nhất đo được trên `gold_real`:
#   TÊN_XÉT_NGHIỆM      R 0,586 · P 0,583
#   KẾT_QUẢ_XÉT_NGHIỆM  R 0,424 · P 0,429   ← thấp nhất trong 5 nhãn
# Trần nếu làm đúng hoàn toàn: +0,154 final — lớn hơn mọi nhánh khác.
# Xem `docs/synth-corpus-plan-v2.md` §0.2 và §2.3.
#
# ★ BA NGUỒN HỢP LỆ (§4 Phase 1) — và MỘT NGUỒN BỊ CẤM
#   (a) kiến thức panel chuẩn — công thức máu, sinh hoá, đông máu, viêm gan,
#       tim mạch, nước tiểu, chẩn đoán hình ảnh;
#   (b) mẫu `^NHÃN:` trích từ 91 file `data/test` KHÔNG thuộc `gold_real`;
#   (c) 218 `TÊN_XÉT_NGHIỆM` của `data/probe/gold_batch1`.
#
#   ✗ CẤM: `data/probe/gold_real`. Nó là **cổng** — lấy tên từ đó rồi đem chấm
#     trên chính nó thì phép đo thành tự khen (quy tắc §5.7).
#
# ★ KHÔNG NẠP VÀO KB
# Xét nghiệm là địa hạt LOINC, mà LOINC không có trong KB. File này chỉ phục vụ
# luật cấu trúc của `labtest.py`, không phục vụ 4 hàm API của KB.

version: 1
release: "2026-08-02"
sources: [panel_chuan, data_test_91_file, gold_batch1]

# ── Tên xét nghiệm ────────────────────────────────────────────────────────
