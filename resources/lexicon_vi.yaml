# resources/lexicon_vi.yaml — vocabulary the gazetteer cannot contain.
#
# `extract/aho.py` matches names mined from ICD-10 and RxNorm. Those are registers
# of formal nomenclature, and the competition test set is not written in it: 47%
# of the 100 documents are patient-facing Q&A. The entries below are the classes
# the gazetteer structurally cannot hold, each measured as a miss against 20
# hand-annotated test documents (proxy_gold_test/, 724 spans).
#
# Every entry is a literal surface form, matched case-insensitively on token
# boundaries, and is expected to be a concept ANYWHERE it appears — that is the
# bar for adding one. A term that is a concept only in some contexts belongs in
# kvspan.py (label-driven) or aho.py (with a type distribution), not here.
#
# Rebuild nothing after editing: `extract/lexicon.py` reads this file directly.

# ── THUỐC · drug classes and lay names ───────────────────────────────────────
# 14 of the 33 missed drug spans. RxNorm is a registry of ingredients and
# products, so it has no row for "thuốc giảm đau" (painkiller) — but the gold
# annotates the phrase as a THUỐC, because in a patient's own account that IS how
# the drug is named. Ingredient-level codes cannot be assigned to these, and that
# is fine: a span with no code still scores its text and its assertions.
drug_classes:
  - kháng sinh
  - thuốc kháng sinh
  - thuốc giảm đau
  - thuốc giảm đau opioid
  - thuốc chống viêm
  - thuốc chống đông
  - thuốc chống trầm cảm
  - thuốc chống nôn
  - thuốc chống dị ứng
