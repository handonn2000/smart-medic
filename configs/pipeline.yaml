# L0 · configs/pipeline.yaml — every threshold in the project lives here.
#
# Rule: there is NO numeric threshold inside src/smart_medic/. A magic number in
# code is a threshold nobody can review. Rules live in resources/*.yaml, numbers
# live here, and the sha256 of this file goes into runs/<ts>/manifest.json.
#
# Read by: decision/ · linking/ · extract/ · layout/ · validate/
# Owner:   HUMAN. Agents propose diffs to this file; they do not invent values.

# ─────────────────────────────────────────────────────────────────────────────
# L2 · layout/ — deterministic document structure. Regex + an indent stack.
# ─────────────────────────────────────────────────────────────────────────────
layout:
  # Measured: three indent tiers are enough for this corpus; a fourth never
  # appears. A line's level is the largest i with indent >= indent_levels[i].
  indent_levels: [0, 4, 8]
  tab_width: 4

  marker:
    # "1.  Tiền sử bệnh lý" · "2)" · "I." · "a)"  — the enumerator, not the text
    numeric: '^[ \t]*(?:\(?\d{1,2}[.)]|[IVXLCDM]{1,5}[.)]|[a-zA-Z][.)])[ \t]+'
    # "- ho khan" · "• Thường là 1 hạch" · "* ..."
    bullet: '^[ \t]*(?:[-*+•·▪◦–—>])[ \t]+'

  kv:
    # A KV/header label: starts with a letter, stops at the first colon, holds no
    # sentence punctuation. 94/100 test files carry a "TÊN: giá trị" line and
    # 97/100 carry a header line.
    # NOTE: applied with re.match(raw, pos, end), which anchors on its own. A '^'
    # here would never match, because '^' ignores `pos` and looks for the real
    # start of the string.
    label: '(?P<label>[^\W\d_][^:;\n]{0,58}?)[ \t]*:'
    label_max_chars: 60
    # "khoảng 11:00 sáng" — a clock. The word-boundary lookbehind is what keeps
    # "HCO3: 32.09" and "Vitamin B12: ..." out: there the digits before the colon
    # are the tail of a lab name, not an hour.
    time_like: '(?<![\w.])\d{1,2}[ \t]*:[ \t]*\d{2}(?![\d.,])'
    clock_window: 4        # chars either side of a colon the clock pattern needs

  split:
    # `;` separates lab items unconditionally:
    #     "Ure: 5,9 mmol/l; Creatinin: 89 micromol/l"
    semicolon: ';'
    # `,` splits ONLY when what follows starts a new lab item. `4,7` in
    # "Chol: 4,7 mmol/l" is a DECIMAL COMMA — splitting it is a measured defect.
    comma: ','
    comma_requires_lab_name: true
    # What "starts a new lab item" means, tested against the text AFTER the comma.
    # No '^': this is applied with re.match(raw, pos, end).
    lab_name: '[ \t]*[^\W\d_][^:;,\n]{0,28}?[ \t]*:'
    # Two KV pairs on one line separated only by whitespace:
    #     "CRP: 227.0 mg/L Creatinin : 46 µmol/L Kali +: 3.6 mmol/L"
    # The label is ONE token plus an optional ion sign — "Kali +", "Na+", "HCO3".
    # Allowing more tokens makes the cut swallow the previous value's unit, so
    # "227.0 mg/L" would lose its "mg/L" to the next label.
    inline_kv: '(?P<label>[^\W\d_]\w*(?:[ \t]{0,2}[+\-])?)[ \t]{0,2}:[ \t]*(?=[<>≤≥(]?[ \t]*[\d.,])'
    inline_kv_min_gap: 2      # chars of value required before a new pair may open

  outline:
    # NUM_HEADER and COLON_HEADER always open a section.
    open_on: ['NUM_HEADER', 'COLON_HEADER']
    # So does a short unpunctuated line that is immediately followed by a bullet
    # at the same or deeper indent — "Thuốc trước khi nhập viện" then "- tylenol".
    # Without this, half the bullet lists in the corpus hang off the wrong section
    # and assertion/ inherits the wrong scope.
    prose_header_max_chars: 60
    prose_header_requires_following_bullet: true
    prose_header_forbidden_tail: '[.!?,;:]$'
    lookahead_lines: 3     # how far to look for the following bullet

  # Token boundaries feeding boundary_priors.
  #
  # The decimal alternative comes FIRST so "4,7" and "227.0" stay one token —
  # this is the `4,7` guard, and ordering is what implements it.
  #
  # The word alternative must accept COMBINING MARKS (U+0300-U+036F …). Python's
  # `\w` rejects them, so on the 41/162 gold files that are not in NFC a token
  # would end one character early: "thở" would tokenise as "thơ" + a stray hook,
  # and 27 gold span ends would fall outside boundary_priors. Measured, not
  # theorised.
  token: '\d+(?:[.,]\d+)+|(?:[^\W\d_]|[̀-ͯ᪰-᫿᷀-᷿])+(?:[’\x27\-_](?:[^\W\d_]|[̀-ͯ᪰-᫿᷀-᷿])+|(?!\d*[.,]\d)\d+(?:[^\W\d_]|[̀-ͯ᪰-᫿᷀-᷿])*)*|\d+'
  # Characters that attach to a token and are still inside a span:
  #   "96%" · "protein 2+" · "chức năng gan (LFTs)" · "37°"
  token_suffix: '[%‰+°)\]}>]+'
  token_prefix: '[(\[{<]+'

# ─────────────────────────────────────────────────────────────────────────────
# L3 · extract/ — RAW model threshold. decision/ makes the real call.
# ─────────────────────────────────────────────────────────────────────────────
extract:
  model_threshold: 0.15

  # ── LANE R · the recall floor (P1). No model, no checkpoint, no GPU. ────────
  # These are PRIORS on "is this hit a real entity", not thresholds: the only
  # comparison against a threshold happens in decision/emit.py. They exist here
  # because a number baked into extract/*.py is a number nobody can review.
  recall_floor:
    aho:
      # Built by `python3 scripts/build_gazetteer.py`. linking/ reads the SAME
      # artifact at P5 — one index, two readers. src/ never imports scripts/.
      gazetteer: 'data/artifacts/gazetteer.json'
      # Measured on gold, sweeping this alone: 2 and 3 are indistinguishable in
      # score (33.21 vs 33.19, inside the 0.010 noise floor) but 2 recovers 30
      # gold entities — chiefly `ho` (cough), a real one-syllable symptom. 4 is
      # clearly worse (−2.5): it starts deleting real short names. P1 owns the
      # RECALL floor, so the tie goes to the setting that misses less.
      min_key_chars: 2
      # ICD-10 carries whole descriptive sentences as "names". They never occur
      # verbatim in a clinical note, and they inflate the automaton.
      max_key_tokens: 8
      # What may sit BETWEEN two tokens of one name. Whitespace and hyphens only:
      # `restyled/` hard-wraps mid-phrase (one gold span is "tim \nenzym"), but a
      # name may not jump a comma, a colon or a sentence end.
      phrase_filler: '[\s\-–—]*'
      # Evidence, by where the surface form came from. `silver` was observed in a
      # real annotation, so it is worth more than an ICD-10 label that merely
      # happens to be a Vietnamese word.
      source_score:
        silver: 0.55
        rxnorm: 0.50
        icd_vi: 0.35
      source_score_default: 0.30
      multi_token_bonus: 0.15

    labvalues:
      name_score: 0.60
      abbrev_name_score: 0.45      # case-sensitive AND value-gated, still riskier
      value_score: 0.55
      kv_known_label_score: 0.65   # label is in the lab lexicon
      kv_unknown_label_score: 0.40 # unseen label, value looks like a measurement

    kvspan:
      # Measured: only 6.7% of gold spans coincide with a unit value or a bullet.
      # This lane is for the 94/100 TEST files with `TÊN: giá trị` lines, which
      # gold cannot show. Kept narrow on purpose.
      max_value_tokens: 6
      score: 0.35
      bullet_score: 0.30
      bullets_inherit_header: true
      strip_trailing: '.,;:)]'
      # Section label -> type distribution. Longest prefix wins.
      label_types:
        'chẩn đoán':        {CHẨN_ĐOÁN: 0.90, TRIỆU_CHỨNG: 0.10}
        'chẩn đoán chính':  {CHẨN_ĐOÁN: 0.92, TRIỆU_CHỨNG: 0.08}
        'chẩn đoán vào viện': {CHẨN_ĐOÁN: 0.92, TRIỆU_CHỨNG: 0.08}
        'chẩn đoán ra viện':  {CHẨN_ĐOÁN: 0.92, TRIỆU_CHỨNG: 0.08}
        'bệnh chính':       {CHẨN_ĐOÁN: 0.90, TRIỆU_CHỨNG: 0.10}
        'tiền sử bệnh':     {CHẨN_ĐOÁN: 0.75, TRIỆU_CHỨNG: 0.25}
        'tiền sử bệnh lý':  {CHẨN_ĐOÁN: 0.75, TRIỆU_CHỨNG: 0.25}
        'ts bệnh':          {CHẨN_ĐOÁN: 0.75, TRIỆU_CHỨNG: 0.25}
        # Measured on the leverage map: isFamily is worth 0.26 points, so the
        # family-history section is typed like any other history section and no
        # effort goes into the flag itself.
        'tiền sử gia đình': {CHẨN_ĐOÁN: 0.70, TRIỆU_CHỨNG: 0.30}
        # Generic fallbacks. Matching is longest-prefix-first, so the specific
        # rows above still win; these only catch labels none of them covers.
        # Added from the TEST corpus, where 90/100 files carry a `label: value`
        # line but almost none of them is a lab measurement — `Lý do nhập viện:
        # Nôn ra máu`, `Bệnh lý mãn tính: hội chứng ruột kích thích`. ⚠ GOLD
        # CANNOT MEASURE THIS: it is synthetic `restyled/` prose with almost no
        # such lines, so these rows are justified by the input distribution, not
        # by a score delta. Do not read a gold-neutral result as "no effect".
        'tiền sử':          {CHẨN_ĐOÁN: 0.70, TRIỆU_CHỨNG: 0.30}
        'lý do':            {TRIỆU_CHỨNG: 0.65, CHẨN_ĐOÁN: 0.35}
        'lý do vào viện':   {TRIỆU_CHỨNG: 0.65, CHẨN_ĐOÁN: 0.35}
        'lý do khám':       {TRIỆU_CHỨNG: 0.65, CHẨN_ĐOÁN: 0.35}
        'lý do nhập viện':  {TRIỆU_CHỨNG: 0.65, CHẨN_ĐOÁN: 0.35}
        'bệnh lý mãn tính': {CHẨN_ĐOÁN: 0.85, TRIỆU_CHỨNG: 0.15}
        'bệnh lý':          {CHẨN_ĐOÁN: 0.85, TRIỆU_CHỨNG: 0.15}
        'triệu chứng':      {TRIỆU_CHỨNG: 0.88, CHẨN_ĐOÁN: 0.12}
        'triệu chứng hiện tại': {TRIỆU_CHỨNG: 0.88, CHẨN_ĐOÁN: 0.12}
        'thuốc':            {THUỐC: 0.95, CHẨN_ĐOÁN: 0.05}
        'thuốc dùng':       {THUỐC: 0.95, CHẨN_ĐOÁN: 0.05}
        'thuốc đang dùng':  {THUỐC: 0.95, CHẨN_ĐOÁN: 0.05}
        'thuốc điều trị':   {THUỐC: 0.95, CHẨN_ĐOÁN: 0.05}
        'thuốc trước khi nhập viện': {THUỐC: 0.95, CHẨN_ĐOÁN: 0.05}
        'dị ứng':           {THUỐC: 0.70, TRIỆU_CHỨNG: 0.30}

    lexicon:
      # resources/lexicon_vi.yaml — the vocabulary a KB-derived gazetteer cannot
      # hold: drug CLASSES ("thuốc lợi tiểu" has no RxNorm ingredient row), lay
      # vitamin names ("B12", not "cyanocobalamin"), and the short symptom words
      # a patient actually writes ("ngứa", "mề đay", "hồi hộp").
      #
      # Why it exists: 47/100 test documents are patient-facing Q&A, and against
      # 20 hand-annotated test documents the pre-lexicon run missed 33 THUỐC (14
      # of them class or lay names, 4 vitamins) and 134 TRIỆU_CHỨNG (73 of two
      # words or fewer). Recall pays three times over — under `penalised` a
      # missed entity scores zero in text, assertions AND candidates.
      enabled: true
      # Below every gazetteer source_score (0.30–0.55) on purpose: this lane
      # knows a type but no code, so where both fire the gazetteer should win.
      # Still above emit_threshold 0.25, or the lane would be a no-op.
      score: 0.28
      # Same filler as aho: whitespace and hyphens may sit inside a phrase, a
      # comma or sentence end may not.
      phrase_filler: '[\s\-–—]*'
      bullet_score: 0.30
      bullets_inherit_header: true
      strip_trailing: '.,;:)]'
      # Section label -> type distribution. Longest prefix wins.
      label_types:
        'chẩn đoán':        {CHẨN_ĐOÁN: 0.90, TRIỆU_CHỨNG: 0.10}
        'chẩn đoán chính':  {CHẨN_ĐOÁN: 0.92, TRIỆU_CHỨNG: 0.08}
        'chẩn đoán vào viện': {CHẨN_ĐOÁN: 0.92, TRIỆU_CHỨNG: 0.08}
        'chẩn đoán ra viện':  {CHẨN_ĐOÁN: 0.92, TRIỆU_CHỨNG: 0.08}
        'bệnh chính':       {CHẨN_ĐOÁN: 0.90, TRIỆU_CHỨNG: 0.10}
        'tiền sử bệnh':     {CHẨN_ĐOÁN: 0.75, TRIỆU_CHỨNG: 0.25}
        'tiền sử bệnh lý':  {CHẨN_ĐOÁN: 0.75, TRIỆU_CHỨNG: 0.25}
        'ts bệnh':          {CHẨN_ĐOÁN: 0.75, TRIỆU_CHỨNG: 0.25}
        # Measured on the leverage map: isFamily is worth 0.26 points, so the
        # family-history section is typed like any other history section and no
        # effort goes into the flag itself.
        'tiền sử gia đình': {CHẨN_ĐOÁN: 0.70, TRIỆU_CHỨNG: 0.30}
        # Generic fallbacks. Matching is longest-prefix-first, so the specific
        # rows above still win; these only catch labels none of them covers.
        # Added from the TEST corpus, where 90/100 files carry a `label: value`
        # line but almost none of them is a lab measurement — `Lý do nhập viện:
        # Nôn ra máu`, `Bệnh lý mãn tính: hội chứng ruột kích thích`. ⚠ GOLD
        # CANNOT MEASURE THIS: it is synthetic `restyled/` prose with almost no
        # such lines, so these rows are justified by the input distribution, not
        # by a score delta. Do not read a gold-neutral result as "no effect".
        'tiền sử':          {CHẨN_ĐOÁN: 0.70, TRIỆU_CHỨNG: 0.30}
        'lý do':            {TRIỆU_CHỨNG: 0.65, CHẨN_ĐOÁN: 0.35}
        'lý do vào viện':   {TRIỆU_CHỨNG: 0.65, CHẨN_ĐOÁN: 0.35}
        'lý do khám':       {TRIỆU_CHỨNG: 0.65, CHẨN_ĐOÁN: 0.35}
        'lý do nhập viện':  {TRIỆU_CHỨNG: 0.65, CHẨN_ĐOÁN: 0.35}
        'bệnh lý mãn tính': {CHẨN_ĐOÁN: 0.85, TRIỆU_CHỨNG: 0.15}
        'bệnh lý':          {CHẨN_ĐOÁN: 0.85, TRIỆU_CHỨNG: 0.15}
        'triệu chứng':      {TRIỆU_CHỨNG: 0.88, CHẨN_ĐOÁN: 0.12}
        'triệu chứng hiện tại': {TRIỆU_CHỨNG: 0.88, CHẨN_ĐOÁN: 0.12}
        'thuốc':            {THUỐC: 0.95, CHẨN_ĐOÁN: 0.05}
        'thuốc dùng':       {THUỐC: 0.95, CHẨN_ĐOÁN: 0.05}
        'thuốc đang dùng':  {THUỐC: 0.95, CHẨN_ĐOÁN: 0.05}
        'thuốc điều trị':   {THUỐC: 0.95, CHẨN_ĐOÁN: 0.05}
        'thuốc trước khi nhập viện': {THUỐC: 0.95, CHẨN_ĐOÁN: 0.05}
        'dị ứng':           {THUỐC: 0.70, TRIỆU_CHỨNG: 0.30}

    # Source priority when two lanes propose overlapping spans. The lab lanes win
    # on the two lab types because they read the line structure the gazetteer
    # cannot see. Full graph-based merging with weighted-median boundaries is P3
    # (`overlap_graph.py` + `boundary.py`); this is the P1 stand-in.
    # `lexicon` is last: it proposes a type with no code behind it, so any other
    # lane claiming the same span should win the tie. Length still outranks
    # priority (see extract/__init__._merge).
    merge_priority: ['labvalues', 'aho', 'kvspan', 'lexicon']

  harmonize:
    # Measured: THUỐC↔TÊN_XÉT_NGHIỆM confuse each other and harmonising helps.
    # CHẨN_ĐOÁN↔TRIỆU_CHỨNG do NOT — harmonising them loses points.
    pairs: [['THUỐC', 'TÊN_XÉT_NGHIỆM']]
    min_majority: 4
    min_ratio: 4

# ─────────────────────────────────────────────────────────────────────────────
# L4a · assertion/
# ─────────────────────────────────────────────────────────────────────────────
assertion:
  # isFamily is worth 0.26 points on the leverage map ⇒ do not invest in it.
  flags: ['isNegated', 'isHistorical']

# ─────────────────────────────────────────────────────────────────────────────
# L4b · linking/
# ─────────────────────────────────────────────────────────────────────────────
linking:
  target_tty: 'IN'                  # ADR 0001 CHỐT 30/07 — Probe B ΔB = +1.5429.
                                    # Stays a parameter: the ADR's fallback to a
                                    # product tier must remain one YAML edit.
  exclude_rel: ['inactive_ingredient_of']
  exclude_sty: ['T200']             # DROP by T200; do NOT whitelist T109/T121

  # Precomputed by `python3 scripts/build_edge_index.py` and COMMITTED. It
  # replaces the raw RXNCUI.RRF (1.7 MB) + RXNSTY.RRF (20 MB) that edge_verify.py
  # used to read at inference time: both are licence-gated UMLS drops that
  # .gitignore excludes, so a clean checkout raised ConfigError on the first drug
  # span, and PRD §5 disqualifies a submission the organisers cannot re-run. Only
  # two columns of those 22 MB are used — 2.7 MB of JSON.
  # Rebuild and re-commit after refreshing RxNorm or changing exclude_sty above;
  # the loader refuses an index built for a different exclude_sty.
  edge_index: 'data/artifacts/edge_index.json'

  # linking/icd.py — a code for a diagnosis the gazetteer missed exactly.
  # On a span we were leaving EMPTY, a wrong code scores the same 0 as no code, so
  # retrieval is a free bet; the only loss is on spans whose gold is empty.
  # Measured 2026-07-30 over the 528 such spans: 513 (97.2%) have a gold code,
  # 15 (2.8%) do not. Sweep of the floor, net spans rescued:
  #   0.00 → +124   0.40 → +124   0.50 → +125   0.60 → +111   0.70 → +97   0.80 → +56
  # Flat from 0.00 to 0.50 and falling after, so 0.50 is the plateau edge — the
  # highest floor that costs nothing, not a tuned optimum.
  icd_retrieval:
    min_similarity: 0.50
    # Applied only when the span is a TRIỆU_CHỨNG (decision/emit.py passes the
    # flag). Plain IDF-cosine reliably picks the wrong code for a bare symptom
    # word, because a rare disease name containing that word outweighs the plain
    # symptom entry: "sốt" → A68 (relapsing fever) instead of R50 (fever), "nôn"
    # → Y53.7 (poisoning by emetics) instead of R11. Chapter XVIII (R00–R99) is
    # titled "Symptoms, signs and abnormal clinical findings" — for a symptom
    # span that is where the code belongs.
    #
    # A preference, not a filter: a symptom whose best match is a genuine disease
    # code still keeps it when the margin exceeds the bonus.
    #
    # Swept over the 1245 symptom spans of the test run:
    #   bonus   spans coded   in chapter R   %R
    #    1.00       1168           446       38%
    #    1.25       1160           653       56%
    #    1.40       1073           760       71%
    #    1.50       1067           760       71%
    #    1.75       1041           764       73%
    #    2.00        997           764       77%
    #    2.50        889           764       86%
    #
    # The coded COUNT falls as the bonus rises, which is not obvious: the
    # similarity floor is applied to the winner's unboosted cosine, so when the
    # boost hands the win to a chapter-R entry with a weaker cosine, that entry
    # can fall below the floor and the span ends up with no code at all.
    #
    # So %R is the wrong thing to maximise — a lost code forfeits a possible +1
    # exactly like a wrong one. Maximising expected CORRECT codes
    # (R-count·a_R + other-count·a_other) puts the optimum at 1.40–1.75 under
    # every plausible pair of accuracies, and the curve is flat across that
    # range. 1.50 sits in the middle of the plateau.
    #
    # What it fixes, on the highest-frequency surfaces:
    #   "sốt"       A68   (relapsing fever)      → R50.9  (fever, unspecified)
    #   "nôn"       Y53.7 (poisoning by emetics) → R11    (nausea and vomiting)
    #   "chóng mặt" A88.1 (epidemic vertigo)     → R42    (dizziness)
    #   "đau"       M25.5 (joint pain)           → R51    (headache→pain)
    #   "phù"       G93.6 (cerebral oedema)      → R60.9  (oedema)
    symptom_chapter_bonus: 1.50

# ─────────────────────────────────────────────────────────────────────────────
# L4a · assertion/ — isNegated / isHistorical. isFamily is deliberately absent.
# ─────────────────────────────────────────────────────────────────────────────
# Only ~13% of MATCHED gold entities carry an assertion, derived from the
# leaderboard: submission A emitted `assertions: []` everywhere and still scored
# J_assertion = 30.9496 against text = 26.63, which puts
# P(gold assertions empty | matched) near 0.87. So a flag we emit where gold has
# none turns a scored 1 into a 0, and there are roughly seven such entities for
# every one we could rescue. Every number here is set for precision.
assertion:
  negation:
    # Swept against 20 hand-annotated test documents (proxy_gold_test/), counting
    # net points (a true positive turns 0→1, a false positive turns 1→0):
    #   window  commas   tp  fp  net
    #     15     none    27   0  +27   ← this row
    #     20     none    28   2  +26
    #     20      ≤2     31   4  +27   (same net, 4× the expensive error)
    #     40      ≤2     31   7  +24
    # 15/none is chosen over 20/≤2 on equal net because its errors are all of the
    # cheap kind. Widening buys recall in negated comma lists ("Không ghi nhận co
    # giật, cứng đờ, cắn lưỡi" — three spans, we catch one) at the price of
    # affirmed items after a clause boundary, which cost double.
    max_chars: 15
    allow_comma: false

  # The share of emitted entities allowed to carry an assertion. Not a tuning
  # knob — a tripwire. Gold on the synthetic corpus flags 29.6% of entities,
  # the real test set ~13% (leaderboard) and 11.6% (hand-annotated sample), so a
  # run that drifts toward the synthetic rate is over-flagging against the thing
  # we are scored on. Outside this band the run stops rather than submits.
  rate_band: [0.05, 0.16]

# ─────────────────────────────────────────────────────────────────────────────
# L5 · decision/ — the ONLY layer allowed to apply a threshold.
# ─────────────────────────────────────────────────────────────────────────────
decision:
  # Measured (leverage map §D.2): at a high miss-rate, opening the gate pays;
  # near the ceiling it does not. Hence a TABLE keyed by the run's own entity
  # density, not a constant.
  # ⚠ THE DENSITY-KEYED TABLE WAS REMOVED 2026-07-31 (W5). It read
  #     <0.50 → 0.25 · 0.50-0.80 → 0.38 · >0.80 → 0.45
  # against `gold_density_per_file: 45.9`, and every run printed a REGIME
  # MISMATCH warning saying the constant gate was looser than the schedule
  # intended and the run was over-generating.
  #
  # Swept end to end against 20 hand-annotated TEST documents (candidates held
  # out — that sample carries no codes):
  #     p      spans   recall  precision   score
  #    0.10    2912    0.622     0.693     44.10
  #    0.20    2912    0.622     0.693     44.10
  #    0.25    2912    0.622     0.693     44.10   ← shipped
  #    0.30    2555    0.526     0.716     38.55
  #    0.35    2518    0.526     0.719     38.60
  #    0.45    2427    0.503     0.728     37.62
  #
  # Tightening costs 5.5 points at the first step. Two separate errors had to be
  # unwound to see it:
  #
  # 1. `gold_density_per_file: 45.9` came from the SYNTHETIC corpus (7435/162).
  #    The real test set carries 36.2 entities/file in the annotated sample, so
  #    every ratio the table compared against was wrong by 27%. Same
  #    synthetic-gold calibration error as the diagnosis-code verdict (ADR 0006),
  #    reaching a second parameter.
  #
  # 2. Fixing the denominator alone made it WORSE: the corrected ratio is
  #    29.12/36.2 = 0.804, which selects the tightest row and −5.5 points. The
  #    table's premise — "high density means we are over-generating, so tighten"
  #    — is simply false here. Recall is still 0.622 at 29.12 entities/file; the
  #    lexicon lane added spans that were RIGHT, and density rose because the
  #    test set is denser than the run, not because the run got sloppy.
  #
  # So the tiers are gone rather than re-tuned. Keeping a principled-looking
  # schedule whose own sweep contradicts it is worse than one measured constant.
  # Restore a schedule only with a sweep that shows a crossover — this one has no
  # crossover anywhere in the measured range.
  #
  # The asymmetry behind the flat answer: under `penalised` a missed entity
  # scores zero in text, assertions AND candidates at once, while a spurious one
  # only dilutes a document mean. Below 0.25 the curve is flat because no lane
  # proposes anything weaker (lexicon, the lowest, scores 0.28).
  emit_threshold: 0.25

  # Reported in the run log and used for the out-of-range check, no longer a
  # divisor for choosing `p`. 724 entities over 20 hand-annotated test documents.
  gold_density_per_file: 36.2

  # Density ratios (run density ÷ gold_density_per_file) the threshold above was
  # actually swept over. Outside this, `p` is still applied — it is flat across
  # everything measured — but the run prints a warning, because a ratio this far
  # out usually means a lane changed rather than the corpus. The shipped run
  # sits at 0.80.
  swept_density_ratio: [0.50, 1.20]
  q0:
    CHẨN_ĐOÁN: 0.0521               # P(gold candidate list empty)
    THUỐC:     0.0588
  diagnosis_always_single_code: true  # p_d = 0.0000 over 1456 diagnosis mentions
  top1_top2_margin:
    THUỐC: 0.1007                   # reference marker only; KB rules decide

  # How many codes leave `decision/` per entity. Measured 2026-07-30 on 162 gold
  # under the PUBLISHED metric (ADR 0002, "Đặc tả CHÍNH THỨC"):
  #   0 codes        candidates 44.97  score 51.61   ← what shipped before this
  #   CĐ 1 · THUỐC 1 candidates 56.89  score 56.37   +4.77
  #   CĐ 1 · THUỐC 2 candidates 57.74  score 56.71   +5.11  ← this row
  #   CĐ 2 · THUỐC 2 candidates 57.74  score 56.71   Δ −0.002, under the noise floor
  # A second diagnosis code buys nothing, which is `diagnosis_always_single_code`
  # above confirmed end-to-end: gold carries exactly one code on all 1456
  # diagnosis mentions, so a second one can only shrink the Jaccard. THUỐC gets
  # two because 8.4% of drug mentions are combination products with two
  # ingredient codes.
  # ⚠ CHẨN_ĐOÁN SET TO 0 ON LEADERBOARD EVIDENCE, 2026-07-30 22:11.
  # Gold said diagnosis codes were worth +5.11. The leaderboard says the opposite,
  # and the leaderboard is the ground truth we are scored on:
  #   Probe A   0 codes                J_candidates 11.0259
  #   Probe B   228 drug codes         J_candidates 14.8832   (+3.8573)
  #   full      948 codes (764 diag)   J_candidates 10.4617   (−0.5642)
  # Drug codes are worth +3.86 on their own, so the 764 diagnosis codes are
  # costing ≈ −4.42 on J_candidates = −1.77 on the final score.
  #
  # Mechanism: for a MATCHED entity, emitting a code when gold carries none turns
  # a free J=1 into J=0. On our gold corpus P(gold empty | CHẨN_ĐOÁN) = 0.0521, so
  # the bet looked safe. On the organisers' test set it evidently is not — the same
  # gold≠test gap that made the section prior worthless (39% of test is Q&A, gold
  # 0%; 14% header overlap). Drugs transfer, diagnoses do not.
  #
  # Setting this to 0 also disables `linking/icd.py` retrieval, which never fires
  # at cap 0 — one knob, both paths. Raise it again only against a leaderboard
  # measurement, never against a gold measurement.
  # ⚠ REOPENED 2026-07-31 — the −1.77 attributed to diagnosis codes is a
  # CONFOUNDED measurement, and two independent readings of the leaderboard say
  # the opposite. Both are arithmetic on the three published submissions, not
  # gold measurements, so neither repeats the gold≠test mistake.
  #
  # 1. Submission C was not "B + diagnosis codes". `text` and `J_assertion` do
  #    not depend on candidates at all, so an experiment that only added codes
  #    must leave both columns untouched:
  #        A → B  text +0.0000   J_assert +0.0000   (same spans: clean A/B test)
  #        B → C  text +0.2000   J_assert +0.2532   (spans CHANGED)
  #    C bundled the P3 type fixes with the diagnosis codes. Charging the whole
  #    −1.63 to the codes assigns a confounded effect to one cause — the exact
  #    extrapolation tab 09 was written to warn against. Diagnosis codes have
  #    never been measured in isolation.
  #
  # 2. The share of gold entities carrying a code is bounded by the leaderboard.
  #    With every prediction empty, J_candidates = m·P(gold cand empty) and
  #    J_assertion = m·P(gold assert empty); m cancels in the ratio:
  #        P(cand empty) / P(assert empty) = 11.0259 / 30.9496 = 0.356
  #    P(assert empty) ≤ 1, so P(gold candidates empty | matched) ≤ 0.356.
  #    Measured on 20 hand-checked test documents (proxy_gold_test/), weighting
  #    each type by the W_i the official formula actually uses:
  #        gold codes CHẨN_ĐOÁN + THUỐC only  → P(cand empty) = 0.636  ✗ > 0.356
  #        gold codes those + TRIỆU_CHỨNG     → P(cand empty) = 0.320  ✓ ≤ 0.356
  #    The first hypothesis is arithmetically impossible. Gold assigns ICD codes
  #    to symptoms.
  #
  # Why this cannot lose points on a MATCHED entity, which is where all the fear
  # was. Jaccard on the candidate set, by case:
  #        gold has a code, we emit none   → 0   (already lost)
  #        gold has a code, we emit wrong  → 0   (loses nothing further)
  #        gold has a code, we emit right  → 1   (+1)
  #        gold empty,      we emit none   → 1   (already held)
  #        gold empty,      we emit a code → 0   (the ONLY downside)
  # A spurious span scores 0 whatever it carries, so a code there is free. The
  # sole risk is the last row, and its probability is bounded above at 0.320 —
  # most of which is the two lab types, which stay at 0 below.
  #
  # Raise or lower these against a LEADERBOARD reading, never a gold one.
  max_candidates_per_type:
    CHẨN_ĐOÁN: 1                    # 1, not 2: diagnosis_always_single_code
    THUỐC: 2                        # 8.4% of drugs are combinations → two INs
    TRIỆU_CHỨNG: 1                  # NEW — see the derivation above
  # Tie-break when a surface form carries several codes (347 of 2650 codeable
  # spans do). Shortest-first prefers the 3-character block code, which the task
  # permits (I48.0 → I48) and which is the safer bet when nothing disambiguates.
  # Measured against plain ascending sort: +0.033 (bar 0.025); longest-first is
  # −0.038, i.e. actively worse. `code_order` must stay deterministic — two builds
  # of one commit have to produce the same archive (ADR 0005).
  code_order: 'shortest_first'      # shortest_first | ascending

# ─────────────────────────────────────────────────────────────────────────────
# L6 · validate/ — the hard gate. 11.59 points live here.
# ─────────────────────────────────────────────────────────────────────────────
validate:
  # An offset mismatch is always a pipeline bug, never data noise ⇒ raise, never
  # repair. Repairing it would hide exactly the NFC bug the check exists to find.
  strict_offsets: true
  # Schema constraints ARE repaired: they are model habits, and the enforcement
  # point is serialisation. 0/7435 gold spans are nested, so dropping the
  # contained span is the policy that matches the data.
  nesting_policy: 'keep_longer'
  drop_unknown_codes: true
  json:
    indent: 2
    field_order: ['text', 'type', 'candidates', 'assertions', 'position']

# ─────────────────────────────────────────────────────────────────────────────
# Knowledge-base paths, for RUNTIME readers (validate/, linking/).
#
# scripts/kb_sources.py is the build-time equivalent. src/ may not import
# scripts/ — the dependency runs one way — so the paths are declared here in L0
# instead. Keep the two in step: the layout is flat, no release subdirectories.
# ─────────────────────────────────────────────────────────────────────────────
knowledge_base:
  root: 'data/knowledge_base'
  icd10_vi: 'ICD10.csv'             # Vietnamese, 13189 codes / 36689 names
  icd10_vi_header_row: 5            # 1-based: rows 1-4 are a title block
  icd10_vi_code_column: 'Mã'
  rxnconso: 'RXNCONSO.RRF'          # field 1 is RXCUI
  cache: 'data/artifacts/kb_codes.json'
