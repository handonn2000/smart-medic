<!DOCTYPE html>

<title>smart-medic — nhãn dev 20 file</title>
<style>
:root{
  --tc-bg:#fef3c7; --tc-fg:#92400e; --tc-bd:#fcd34d;

  --kq-bg:#ede9fe; --kq-fg:#5b21b6; --kq-bd:#c4b5fd;
  --cd-bg:#fee2e2; --cd-fg:#991b1b; --cd-bd:#fca5a5;

}
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:17px;margin:0 0 3px;font-weight:650}
.sub{color:var(--mute);font-size:12.5px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .grow{flex:1 1 auto}
select,button{font:inherit;font-size:13px;color:var(--ink);background:#fff;
  border:1px solid #d1d5db;border-radius:7px;padding:5px 9px;cursor:pointer}
select{min-width:118px}
button:hover{background:#f3f4f6}
button:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;
  border-radius:7px;border:1px solid;cursor:pointer;user-select:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.chip.off{opacity:.32;filter:grayscale(.7)}
.chip[data-k=TC]{background:var(--tc-bg);color:var(--tc-fg);border-color:var(--tc-bd)}
.chip[data-k=XN]{background:var(--xn-bg);color:var(--xn-fg);border-color:var(--xn-bd)}
.chip[data-k=KQ]{background:var(--kq-bg);color:var(--kq-fg);border-color:var(--kq-bd)}
.chip[data-k=CD]{background:var(--cd-bg);color:var(--cd-fg);border-color:var(--cd-bd)}
.chip[data-k=TH]{background:var(--th-bg);color:var(--th-fg);border-color:var(--th-bd)}
.tog{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);
  cursor:pointer;user-select:none}
.doc{padding:22px 26px;white-space:pre-wrap;word-wrap:break-word;
  font-size:15.5px;line-height:2.35;min-height:150px}
.ent{border-radius:5px;padding:2px 4px;cursor:pointer;font-weight:600;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
  transition:box-shadow .1s}
.ent:hover{box-shadow:0 0 0 2px rgba(31,41,51,.28)}
.ent.sel{box-shadow:0 0 0 2px #1f2933}
.ent.rev{border-bottom:2px dashed rgba(31,41,51,.42)}
.ent-TC{background:var(--tc-bg);color:var(--tc-fg)}
.ent-XN{background:var(--xn-bg);color:var(--xn-fg)}
.ent-KQ{background:var(--kq-bg);color:var(--kq-fg)}
.ent-CD{background:var(--cd-bg);color:var(--cd-fg)}
.ent-TH{background:var(--th-bg);color:var(--th-fg)}
.bdg{font-size:8.5px;font-weight:700;margin-left:2px;opacity:.72;

.det{border-top:1px solid var(--line);padding:16px 26px 20px;background:#fcfcfd;min-height:132px}
.row{display:grid;grid-template-columns:112px 1fr;gap:10px;padding:5px 0;align-items:start}
.k{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:#9ca3af;padding-top:3px;

.v{font-size:14px}
.v .q{font-weight:650}
.pill{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;

.pill-TC{background:var(--tc-bg);color:var(--tc-fg);border-color:var(--tc-bd)}
.pill-XN{background:var(--xn-bg);color:var(--xn-fg);border-color:var(--xn-bd)}
.pill-KQ{background:var(--kq-bg);color:var(--kq-fg);border-color:var(--kq-bd)}
.pill-CD{background:var(--cd-bg);color:var(--cd-fg);border-color:var(--cd-bd)}
.pill-TH{background:var(--th-bg);color:var(--th-fg);border-color:var(--th-bd)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:#eef2f7;border:1px solid #dbe1ea;border-radius:5px;padding:2px 7px;
  margin-right:5px;display:inline-block;margin-bottom:3px}
.code i{font-style:normal;color:var(--mute);font-weight:400}
.none{color:#9ca3af}
.tag{display:inline-block;font-size:11px;font-weight:650;padding:3px 8px;border-radius:20px}
.tag-ok{background:#e8f5ec;color:#166534}
.tag-rv{background:#fdf0e3;color:#9a3412}
.diff{margin-top:9px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.diff table{border-collapse:collapse;width:100%;font-size:12.5px}
.diff th,.diff td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);

.diff th{background:var(--panel);font-size:10.5px;letter-spacing:.07em;color:#9ca3af;

.diff td.hl{background:#fffbeb}
.diff .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.stats{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--mute);

.hint{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.7}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#eef2f7;
  border:1px solid #dbe1ea;border-bottom-width:2px;border-radius:4px;padding:1px 5px}
</style>
</head>

 cảm ơn Bác sĩ.\nCâu trả lời của bác sĩ: \nChào bạn, kể từ tháng 6/2012 thuốcVastarel (trimetazidin) đã được cảnh báo ở Pháp, và sau đó là ở Châu Âu và trên toàn thế giới về việc lưu ý tác dụng bất lợi của thuốc này là lớn hơn lợi ích của thuốc: \nnhư làm nặng hơn hội chứng Parkinson, gây run tay chân, mất thăng bằng khi đi hoặc run rấy toàn thân. Chính vì vậy mà thuốc bị giới hạn chỉ định \"điều trị triệu chứng đau thắt ngực ổn địnhkhi bệnh nhân\n không dung nạp với các thuốc khác hoặc các thuốc khác dùng không hiệu quả\". Thuốc này chống chỉ định ở người bị chóng mặt, ù tai, rối loạn thị lực, đặc biệt không dùng thuốc ở người bị Parkinson\n2.  Tiền sử bệnh hiện tại\n    Lý do nhập viện\n    - yếu sức nửa người bên phải\n    - tình trạng tri giác giảm sút\n    - nhìn song thị\n    Thời điểm khởi phát triệu chứng\n    - Thời gian: khoảng 11:00 sáng\n    - Khởi phát cấp tính hay từ từ: Không ghi rõ\n    Diễn biến bệnh\n    - Được con trai phát hiện tại nhà lúc khoảng 11:00 sáng, nằm sải trên sàn.\n    - Than phiền về không thể tự đứng dậy do yếu sức chân phải.\n    - Không nhớ cách mình bị ngã xuống sàn hay lý do tại sao mình bị ngã.\n    - không thể chịu lực ở chân phải, liên tục khuỵu chân khi được giúp đỡ đứng dậy.\n    - Đã được chụp chụp ct sọ não kết quả âm tính.\n    - Đội ngũ y tế tiến hành chọc dò dịch não tủy.\n    - Bị một cơn nhịp tim chậm nặng và hạ huyết áp ngay sau khi study.\n    - Cơn bệnh tự khỏi sau khi dùng intravenous fluids.\n    - Chụp lại chụp ct sọ não, kết quả âm tính.\n    - Chuyển đến bệnh viện để tiếp tục điều trị.\n    - Được gọi là Code tai biến mạch máu não.\n    - Ban đầu tỉnh chậm phản xạ kém.\n    - Dần dần tỉnh táo hơn tỉnh táo và tỉnh khi gọi.\n    - Phủ nhận các bệnh nền lớn tiền sử bệnh hoặc triệu chứng nào khác ngoại trừ nhiễm trùng nhiễm trùng răng miệng gần đây cần dùng kháng sinh.\n    - Phủ nhận tiền sử bị tai biến mạch máu não hoặc co giật.\n    Triệu chứng khi nhập viện\n    - yếu sức nửa người bên phải\n    - tình trạng tri giác giảm sút\n    - nhìn song thị\n    - mệt mỏi\n    Đặc điểm triệu chứng\n    - Vị trí: yếu chân phải\n    - Mức độ nghiêm trọng: Không ghi rõ\n    - Thời gian: Không ghi rõ\n    - Tần suất: Không ghi rõ\n    - Lan tỏa: Không ghi rõ\n    - Các yếu tố làm nặng thêm: Không ghi rõ\n    - Các yếu tố làm giảm bớt: Không ghi rõ\n    - Triệu chứng liên quan: mệt mỏi\n    Các sự kiện trước khi nhập viện\n    - Được con trai phát hiện tại nhà.\n    - Than phiền về yếu sức chân phải.\n    - Đã được chụp chụp ct sọ não kết quả âm tính.\n    - Tiến hành chọc dò dịch não tủy.\n    - Bị nhịp tim chậm nặng và hạ huyết áp, không đặc hiệu.\n    - Cơn bệnh tự khỏi sau khi dùng intravenous fluids.\n    - Chụp lại chụp ct sọ não, kết quả âm tính.\n    - Đã dùng kháng sinh cho nhiễm trùng nhiễm trùng răng miệng gần đây.\n    Tình trạng ngay trước khi nhập viện\n    - Nằm sải trên sàn.\n    - không thể tự đứng dậy do yếu sức chân phải.\n    - không thể chịu lực ở chân phải, liên tục khuỵu chân.\n    - tỉnh chậm, phản xạ kém.\n\n3.  Đánh giá tại bệnh viện\n    Dấu hiệu lâm sàng\n    - yếu nửa người bên phải\n    - suy giảm tri giác\n    - nhìn song thị\n    - nhịp tim chậm\n    - hạ huyết áp, không đặc hiệu\n    - không nhấc chân phải khỏi mặt giường\n    - chân phải liên tục khuỵ xuống\n    - tỉnh chậm, phản xạ kém\n    Kết quả xét nghiệm\n    - Chẩn đoán hình ảnh\n    - chụp ct sọ não: âm tính\n    - Chụp lại chụp ct sọ não: âm tính\n    Các thủ thuật đã thực hiện\n    - chụp ct sọ não\n    - chọc dò dịch não tủy\n    - Truyền dịch tĩnh mạch","spans":[{"s":35,"e":42,"t":"run tay","ty":"TRIỆU_CHỨNG","c":[],"a":["isFamily"],"st":"agreed","cat":"full_agree","d":null},{"s":79,"e":86,"t":"run tay","ty":"TRIỆU_CHỨNG","c":[],"a":["isFamily"],"st":"agreed","cat":"full_agree","d":null},{"s":190,"e":199,"t":"Nitralmyl","ty":"THUỐC","c":[],"a":["isFamily"],"st":"agreed","cat":"full_agree","d":null},{"s":323,"e":346,"t":"Vastarel (trimetazidin)","ty":"THUỐC","c":[],"a":[],"st":"review","cat" qua đường miệng, buồn nôn và tiêu chảy (2 tuần sau tập viêm dạ dày ruột do virus)\n    - Nhập viện vì nôn ra máu (2 tuần sau tập viêm dạ dày ruột do virus)\n    - nội soi cho thấy nhiều loét tá tràng và hồi tràng (2 tuần sau tập viêm dạ dày ruột do virus)\n    - dương tính xét nghiệm phân tìm cryptosporidium (2 tuần sau tập viêm dạ dày ruột do virus)\n    - Ngừng sử dụng omeprazole để làm test hơi thở h. pylori (gần đây)\n    - Phát triển đau bụng và nôn ra máu trở nên tồi tệ hơn (khi ngừng omeprazole)\n\nChào bạn, bạn mắc ung thư tuyến giáp và chắc đã phẫu thuật, hiện bác sĩ đang kê đơn cho bạn uống levothyroxine với liều 75 microgam/ngày (lưu ý: một viên thuốc Berlthyrox có hàm lượng là 100 microgam chứ không phải 100 miligam như bạn đã nói), là hormone tuyến giáp tổng hợp, nhằm bù lại lượng hormone giáp cơ thể không thể sản sinh ra để duy trì trạng thái sinh lý cân bằng của chức năng tuyến giáp (còn gọi là trạng thái bình giáp). Các nghiên cứu trên phụ nữ cho con bú dùng thuốc levothyroxine cho thấy rằng lượng hormone giáp bài tiết vào sữa mẹ là rất ít (nồng độ khoảng 4 nanogam/mL), thậm chí khi dùng liều cao ************* (200-300 microgam/ngày), và do đó không gây hại cho trẻ bú mẹ. Nói chung, tốt nhất người mẹ cần cho bé bú xong trước khi dùng thuốc để giảm thiểu đến mức thấp nhất những ảnh hưởng với bé. Bạn cũng cần lưu ý khi chia nhỏ viên thuốc để đảm bảo liều lượng chính xác.    - Viêm thực quản độ C ở thực quản dưới\n    - Loét loét thực quản 6 mm có điểm sắc tố\n    - Nhiều loét sạch đáy loét ở tá tràng kéo dài từ hành tá tràng đến hồi tràng sớm","spans":[{"s":73,"e":81,"t":"buồn nôn","ty":"TRIỆU_CHỨNG","c":[],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":85,"e":94,"t":"tiêu chảy","ty":"TRIỆU_CHỨNG","c":[],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":118,"e":128,"t":"Nôn ra máu","ty":"TRIỆU_CHỨNG","c":[],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":144,"e":169,"t":"viêm dạ dày ruột do ,"st":"review","cat":"boundary_conflict","d":{"o":{"type":"CHẨN_ĐOÁN","assertions":[],"candidates":["K26.9"]},"s":{"type":"CHẨN_ĐOÁN","assertions":["isHistorical"],"candidates":["K26.9"]},"ot":"loét ở tá tràng kéo dài từ hành tá tràng đến hồi tràng sớm","stx":"Nhiều loét sạch đáy loét ở tá tràng kéo dài từ hành tá tràng đến hồi tràng sớm"}}]},"5":{"text":"1.  Tiền sử bệnh nội khoa\n    Tiền sử phẫu thuật / thủ thuật: Đã thực hiện phẫu thuật cắt bỏ ống dẫn mật chung, cắt bỏ một phần thùy gan bên trái và nối mật tụy bằng ống dẫn hồi tràng (RNY hepaticojejunostomy) vào ngày [Ngày] vì nghi ngờ ung thư biểu mô tế bào mật không thể cắt bỏ.\n\n2.  Tiền sử bệnh hiện tại\n\nChào bạn\nCó rất nhiều xét nghiệm để đánh giá vô sinh. Bạn xây dựng gia đình 2 năm mà chưa có thai em cần phải đi khám để xác định nguyên nhân. Tối thiểu các xét nghiệm cần có là:\n- Đối với chồng: khám và làm xét nghiệm tinh dịch đồ.\n- Đối với vợ: cần khám và làm tối thiểu các xét nghiệm cận lâm sàng như siêu âm (đánh giá các bất thường về giải phẫu), chụp tử cung vòi trứng (đánh giá hình thái buồng tử cung và độ thông của vòi trứng), xét nghiệm nội tiết (đánh giá chức năng của hệ thống nội tiết, đặc biệt là chức năng buồng trứng).\nKinh nguyệt của bạn thưa, uống thuốc tránh thai kinh nguyệt bình thường bạn cần đi khám để đánh giá bệnh lý cụ thể. Rất có thể bạn bị Hội chứng buồng trứng đa nang (bao gồm rậm lông, béo phì, siêu âm buồng trứng có nhiều nang …) và đây cũng là nguyên nhân gây vô sinh.\nChúc bạn nhiều sức khoẻ!    - Bà ấy phủ nhận bất kỳ buồn nôn, nôn, sốt, ớn lạnh, hoặc dịch rò rỉ quanh ống thông.\n    - Đã thực hiện cholangiogram vào ngày [Ngày] cho thấy tắc nghẽn kéo dài gần chỗ nối mật tụy, ảnh hưởng đến ống dẫn trước và sau bên phải.\n    - Cả hai ống dẫn mật đều được tăng kích cỡ từ 8.5fr lên 10.2 fr vào thời điểm đó.\n    - Đã thực hiện sinh thiết và lấy mẫu bằng bàn chải vào ngày [Ngày] và kết quả lấy mẫu bằng bàn chải cho thấy tế bào bất thường, đáng ngại cho ung thư biểu mô tuyến.\n    - Thảo luận tại cuộc họp [Tên cuộc họp] vào ngày [Ngày] và quyết định rằng bệnh nhân nên được đặt stent thành vách vĩnh viễn.\n    - Bà ấy đã được đặt 3 stent thành vách vĩnh viễn và có 3 ống dẫn mật ngoài-trong tại chỗ.\n    - Bệnh nhân dung nạp thủ thuật tốt.\n    - Sau thủ thuật, bệnh nhân phủ nhận bất kỳ buồn nôn, nôn, đau ngực, hoặc khó thở.\n    - Bà ấy cho biết có một chút đau khi sờ nắn xung quanh vị trí đặt ống dẫn, đặc biệt là khi hít thở sâu.\n    Sự kiện trước khi nhập viện\n    - Được bác sĩ [Tên bác sĩ] khám tại phòng khám vào ngày [Ngày]. Bệnh nhân tình trạng rất tốt.\n    - ăn uống bình thường, cân nặng đã cải thiện, trở lại các hoạt động hàng ngày bình thường.\n    - Có ống dẫn mật xuyên gan tại chỗ.\n    - Phủ nhận buồn nôn, nôn, sốt, ớn lạnh, hoặc dịch rò rỉ quanh ống thông.\n    - Đã thực hiện cholangiogram vào ngày [Ngày] cho thấy tắc nghẽn kéo dài gần chỗ nối mật tụy, ảnh hưởng đến ống dẫn trước và sau bên phải.\n    - Ống dẫn mật được tăng kích cỡ từ 8.5fr lên 10.2 fr vào thời điểm đó.\n    - Đã thực hiện sinh thiết và lấy mẫu bằng bàn chải vào ngày [Ngày] và kết quả lấy mẫu bằng bàn chải cho thấy các tế bào bất thường, đáng lo ngại cho ung thư biểu mô tuyến.\n    - Thảo luận tại cuộc họp [Tên cuộc họp] vào ngày [Ngày] và quyết định rằng bệnh nhân nên được đặt stent thành vách vĩnh viễn.\n\n3.  Đánh giá tại bệnh viện\n    Dấu hiệu lâm sàng: đau khi sờ nắn xung quanh vị trí đặt ống dẫn, đặc biệt là khi hít thở sâu\n    Kết quả phòng thí nghiệm: lấy mẫu bằng bàn chải cho thấy tế bào bất thườngtế bào bất thường, đáng ngại cho ung thư biểu mô tuyến\n    Kết quả chẩn đoán hình ảnh: cholangiogram vào ngày [Ngày] cho thấy tắc nghẽn kéo dài gần chỗ nối mật tụy, ảnh hưởng đến ống dẫn trước và sau bên phải\n    Thủ thuật thực hiện: Đặt 3 stent thành vách vĩnh viễn","spans":[{"s":75,"e":110,"t":"phẫu thuật cắt bỏ ống dẫn mật chung","ty":"TÊN_XÉT_NGHIỆM","c":[],"a":[],"st":"review","cat":"opus_only","d":{"o":{"type":"TÊN_XÉT_NGHIỆM","assertions":[],"c h hưởng đến ống dẫn trước và sau bên phải","ty":"KẾT_QUẢ_XÉT_NGHIỆM","c":[],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":3388,"e":3420,"t":"Đặt 3 stent thành vách vĩnh viễn","ty":"TÊN_XÉT_NGHIỆM","c":[],"a":[],"st":"review","cat":"opus_only","d":{"o":{"type":"TÊN_XÉT_NGHIỆM","assertions":[],"candidates":[]},"s":null,"ot":"Đặt 3 stent thành vách vĩnh viễn","stx":null}}]},"6":{"text":"1.  Tiền sử bệnh lý\n\nBệnh tim mạch do xơ vữa động mạch.\năng huyết áp.Rối loạn lipid máu.\nĐái tháo đường.2. \nBệnh sử\nLý do vào viện: Cơn rối loạn ý thức thoáng qua, nghi ngờ cơn co giật.\nKhoảng 1 tháng trước nhập viện, bệnh nhân bị ngã và được chẩn đoán xuất huyết dưới nhện. Chụp cắt lớp vi tính sọ não cho hình ảnh  xuất huyết dưới nhện vùng trán phải, bầm dập nhu mô vùng trán phải và trán - thái dương phải, kèm một lớp dịch dưới màng cứng mỏng vùng thùy trán phải, nghĩ nhiều đến nang màng nhện hoặc tụ dịch/tụ máu dưới màng cứng mạn tính. \nCác lần chụp CT theo dõi sau đó ổn định và bệnh nhân được xuất viện, hẹn tái khám chuyên khoa Ngoại thần kinh.\nSau xuất viện, bệnh nhân từng quay lại khoa Cấp cứu vì đau đầu kéo dài. \nChụp kiểm tra ghi nhận tụ máu ngoài màng cứng phải cấp tính trên nền tổn thương mạn tính. \nBệnh nhân tiếp tục được theo dõi, các lần chụp CT kiểm tra không ghi nhận diễn tiến xấu nên được xuất viện về nhà.\nTrong thời gian sau đó, bệnh nhân tương đối ổn định nhưng vẫn còn đau đầu vùng thái dương phải và đỉnh đầu, kèm cảm giác tê bì nửa mặt phải, đặc biệt vùng trán phải và da đầu phải từ sau lần ngã.\nNgày vào viện, buổi sáng bệnh nhân thức dậy tỉnh táo, sinh hoạt bình thường, ăn sáng, đọc báo và sử dụng máy tính. Đến cuối buổi sáng, khi đang đi trong nhà, bệnh nhân nói muốn đi vệ sinh. \nNgười nhà nhận thấy bệnh nhân có biểu hiện bất thường, mất định hướng, đi lại không vững và gần như ngất. \nBệnh nhân lúc mở mắt, lúc nhắm mắt, nhiều lần ngửa đầu ra sau và không đáp ứng được các câu hỏi của người nhà.Sau đó bệnh nhân được dìu nằm nghỉ. \nTrong cơn, bệnh nhân kích thích nhẹ, liên tục cố gắng đứng dậy và tỏ ra không hiểu tình trạng đang xảy ra. \nTình trạng ý thức dao động kéo dài khoảng 20 phút rồi cải thiện dần. \nKhi nhân viên cấp cứu đến nơi, bệnh nhân bắt đầu tỉnh táo trở lại và hồi phục hoàn toàn về trạng thái ban đầu.\nBệnh nhân không ghi nhận run giật tay chân, không cứng đờ, không cắn lưỡi và không tiểu tiện không tự chủ trong cơn.\nTriệu chứng khi nhập viện:\nĐau đầu vùng thái dương phải, đỉnh đầu, đôi khi lan ra sau mắt phải.\nTê bì vùng trán phải, da đầu phải và nửa mặt phải.\nCơn rối loạn ý thức thoáng qua.Mất định hướng.\nMất thăng bằng.Gần ngất.\nTình trạng trước nhập viện: Sau cơn bệnh nhân tỉnh táo hoàn toàn, ý thức trở về mức nền ban đầu.\n3. Đánh giá tại bệnh viện\nKhám lâm sàng:\nCó ghi nhận giai đoạn mất định hướng và đi lại không vững theo lời kể người nhà.\nTrong cơn có biểu hiện kích thích nhẹ, ngửa đầu ra sau và nhắm mắt từng lúc.\nChụp cắt lớp vi tính (CT Scanner): Bụng - Tiểu khung thường quy (máy 64 đến 128 dãy, có tiêm thuốc cản quang) — Không in phim.3. \nThủ thuật - Dịch vụ kỹ thuật\nĐiện tâm đồ: Ghi điện tim cấp cứu tại giường.II. Kết quả xét nghiệm & Cận lâm sàng đã có\nXét nghiệm có kết quả : \nKết quả Cận lâm sàng\n. Xét nghiệm Máu Huyết học & Đông máu:WBC : 14.99 G/L NEUT% : 82.9 % (Tăng) \nHGB (Hemoglobin): 92 g/L PT - INR: 1.05\nCận lâm sàng: CT sọ não trước đó ghi nhận xuất huyết dưới nhện vùng trán phải.Bầm dập nhu mô vùng trán phải và trán - thái dương phải.Lớp dịch dưới màng cứng mỏng vùng thùy trán phải, nghĩ đến nang màng nhện hoặc tụ máu dưới màng cứng mạn tính.Tụ máu ngoài màng cứng phải cấp tính trên nền tổn thương mạn tính.\n","spans":[{"s":21,"e":54,"t":"Bệnh tim mạch do xơ vữa động mạch","ty":"CHẨN_ĐOÁN","c":["I25.1"],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":56,"e":68,"t":"ăng huyết áp","ty":"CHẨN_ĐOÁN","c":["I10"],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":69,"e":87,"t":"Rối loạn lipid máu","ty":"CHẨN_ĐOÁN","c" m đang có thai nên không thể dùng thuốc đặc trị được mà chỉ cho thuốc tạm thôi. Em muốn hỏi như sau: 1. Danh sách thuốc BS kê có ảnh hưởng đến em bé trong bụng em không: - ****** (trong HDSD có ghi \"An toàn của ****** trên phụ nữ có thai chưa được thiết lập\") - ******* (*******************, ****************) - ************** 2. Các xét nghiệm/siêu âm/nội soi cần thiết nào cho em mà vẫn an toàn với thai nhi? Em cảm ơn nhiều!\nTrả lời : Chào em,\nThành phần 3 loại thuốc em sử dụng như sau:\nAquima: nhôm hydroxid, magie hydroxid và **********.\nSimenic: Alverin citrate 40mg và Simethicon 100mg\nPimperam: metoclopramide 10mg\nThông tin về độ an toàn khi sử dụng các loại thuốc trên ở phụ nữ mang thai như sau:\nNhôm hydroxid và magie hydroxid có thể sử dụng được cho phụ nữ mang thai để điều trị triệu chứng ợ nóng hoặc trào ngược dạ dày thực quản và cần sử dụng trong mức liều khuyến cáo.\nHiện tại chưa có đủ nghiên cứu về việc sử dụng ********** trên phụ nữ mang thai. Mặc dù chưa khẳng định được thuốc có qua nhau thai hay không nhưng hấp thu của ********** qua ruột bị hạn chế, do đó làm giảm khả năng phơi nhiễm đối với thai nhi.\n    Triệu chứng khi nhập viện\n    - tổn thương vùng âm hộ và mông bên phải\n    - Tổn thương cực kỳ đau đớn\n    - Tình trạng tổn thương dạng bóng nước ngày càng nặng\n    - Lan đến mông bên phải\n    - có dịch giống mủ có màu vàng  chảy ra từ tổn thương\n    Đặc điểm của triệu chứng\nEm nên đến bệnh viện để được bác sĩ chuyên khoa tư vấn kĩ hơn về các xét nghiệm/siêu âm/nội soi cần thiết mà không ảnh hưởng đến thai nhi cũng như được tư vấn về chế độ ăn phù hợp, tránh tình trạng nhịn ăn dẫn đến viêm dạ dày em nhé!\nChúc em luôn vui khỏe","spans":[{"s":113,"e":123,"t":"đau bao tử","ty":"TRIỆU_CHỨNG","c":[],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":297,"e":304,"t":"nội soi","ty":"TÊN_XÉT_NGHIỆM","c":[],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":327,"e":346,"t":"ổ loét trong bao tử","ty":"CHẨN_ĐOÁN","c":["K25    Lý do nhập viện: Bày tỏ tự tử với nhân viên khi xuất viện\n    Triệu chứng hiện tại\n    - tự tử\n    - Lú lẫn từng đợt gần đây\n    - cảm giác chóng mặt\n    - khó khăn khi nhìn gần\n    - rối loạn thị giác, nhìn thấy con cái mình ở góc mắt\n    - ảo giác thị giác (ảo giác thị giác)\n    - Ảo thanh (AH) (ảo giác thính giác)\n    Đặc điểm triệu chứng\n    - tự tử: thụ động, diễn ra liên tục, tưởng tượng về cái chết mãn tính kể từ khi ly hôn\n    - Lú lẫn: từng đợt\n    - chóng mặt\n    - Khó khăn về thị lực gần\n    - rối loạn thị giác: nhìn thấy con cái ở góc mắt\n    - ảo giác thị giác, Ảo thanh (AH): có vẻ là ảo giác hơn là ảo ảnh thực sự\n    Các sự kiện trước khi nhập viện\n    - Được đưa đến Cấp cứu sau khi bày tỏ tự tử với nhân viên khi xuất viện\n    - Được yêu cầu ký một mẫu đơn cam kết đảm bảo an toàn trong 24 giờ trước khi bắt đầu chương trình điều trị bán trú, và anh ấy không thể làm được\n    - chụp ct sọ được phát hiện tình cờ tại Cấp cứu; phát hiện bệnh lý chất trắng\n    - chọc dò dịch não tủy là không phát hiện bất thường\n    - đánh giá thần kinh để tìm bệnh lý chất trắng\n    - các băng nhóm oligoclonal đang chờ kết quả\n    - Được bác sĩ khoa tâm thần cho nhập chỉ định viện tâm thần \n    Tình trạng ngay trước khi nhập viện: Phủ nhận tự tử chủ động, ý định, kế hoạch hiện tại khi đã lên tầng, cảm thấy an toàn\n\n3.  Đánh giá tại bệnh viện\n    Kết quả xét nghiệm: chọc dò dịch não tủy là âm tính\n    Kết quả chẩn đoán hình ảnh: chụp ct sọ: phát hiện bệnh lý chất trắng (được phát hiện tình cờ)\n    Các thủ thuật đã thực hiện: chọc dò dịch não tủy (Đột sống thắt lưng)\n    Các phát hiện chẩn đoán khác\n    - đánh giá thần kinh để tìm bệnh lý chất trắng\n    - các băng nhóm oligoclonal đang chờ kết quả\n    - Nguyên nhân chưa rõ (đối với phát hiện bệnh lý chất trắng)\n6. Sưng hạch cổ\n • Thường là 1 hạch >1,5 cm, chắc, không hóa mủ.\n\nLưu ý quan trọng:\nCác triệu chứng của Kawasaki dễ nhầm với sốt siêu vi, sốt phát ban, nhiễm trùng. Nếu trẻ sốt cao 3–4 ngày + đỏ mắt + phát ban + môi đỏ hoặc lưỡi đỏ → cần nghĩ đến Kawasaki và đưa trẻ đi khám sớm.\n4. Biến chứng nguy hiểm của bệnh Kawasaki\nNếu không điều trị kịp thời, bệnh có thể gây:\nBiến chứng tim mạch (nguy hiểm nhất):\n • Phình giãn động mạch vành\n • Hẹp – tắc động mạch vành\n • Thiếu máu cơ tim\n • Nhồi máu cơ tim\n • Suy vành mạn tính\nKhoảng 25–30% trẻ không điều trị đúng cách sẽ bị biến chứng này.\nBiến chứng khác:\n • Viêm cơ tim\n • Tràn dịch màng tim\n • Tăng men gan\n • Rối loạn tiêu hóa\n5. Chẩn đoán bệnh Kawasaki\n\nTiêu chuẩn chẩn đoán\n\nSốt ≥5 ngày + 4/5 tiêu chí sau:\n 1. Viêm kết mạc 2 bên không ghèn\n 2. Môi – miệng thay đổi (nứt, đỏ, lưỡi dâu tây)\n 3. Tổn thương đầu chi (phù, đỏ, bong da)\n 4. Ban đỏ toàn thân\n 5. Hạch cổ to ≥1,5 cm\n\nCác xét nghiệm cần làm\n","spans":[{"s":48,"e":50,"t":"ho","ty":"TRIỆU_CHỨNG","c":[],"a":["isHistorical"],"st":"review","cat":"sonnet_only","d":{"o":null,"s":{"type":"TRIỆU_CHỨNG","assertions":["isHistorical"],"candidates":[]},"ot":null,"stx":"ho"}},{"s":51,"e":67,"t":"Rối loạn cảm xúc","ty":"CHẨN_ĐOÁN","c":["F39"],"a":["isHistorical"],"st":"review","cat":"boundary_conflict","d":{"o":{"type":"CHẨN_ĐOÁN","assertions":["isHistorical"],"candidates":["F39"]},"s":{"type":"CHẨN_ĐOÁN","assertions":["isHistorical"],"candidates":["F32.9"]},"ot":"Rối loạn cảm xúc","stx":"Rối loạn cảm xúc (trầm cảm)"}},{"s":69,"e":77,"t":"trầm cảm","ty":"CHẨN_ĐOÁN","c":["F32.9"],"a":["isHistorical"],"st":"review","cat":"opus_only","d":{"o":{"type":"CHẨN_ĐOÁN","assertions":["isHistorical"],"candidates":["F32.9"]},"s":null,"ot":"trầm cảm","stx":null}},{"s":88,"e":121,"t":"giai đoạn trầm cảm không đặc hiệu","ty":"CHẨN_ĐOÁN","c":["F32.9"],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":129,"e":150,"t":"hội chứng nghiện rượu","ty":"CHẨN_ĐOÁN","c":["F10.2"],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":190,"e":198,"t":"seroquel","ty":"THUỐC","c":["51272"],"a":["isHistorical"],"st":"review","ca ticoid liều cao kéo dài.\n    - Thở oxy tại nhà\n    - Hội chứng kháng enzym tổng hợp protein.\n    - béo phì\n    - Tăng huyết áp nguyên phát.\n    Tiền sử phẫu thuật / thủ thuật: Sinh thiết nội mạc tử cung gần đây\n    Thuốc trước khi nhập viện\n    -Corticoid liều cao kéo dài\n    - Thở oxy tại nhà\n    - Tăng liều bactrim (do bác sĩ chăm sóc chính kê đơn)\n    - doxycycline (do bác sĩ chăm sóc chính kê đơn)\n- Suy giảm miễn dịch do sử dụng corticoid kéo dài\n2.  Tiền sử bệnh hiện tại\n    Lý do nhập viện: Tình trạng tổn thương vùng âm hộ và mông bên phải ngày càng nặng\n    Diễn biến bệnh\n- Bệnh nhân nhập viện vì tổn thương vùng âm hộ phải lan rộng sang mông phải, diễn biến tăng dần trong khoảng 5 ngày trước nhập viện.\n- Cách nhập viện 5 ngày, bệnh nhân phát hiện một tổn thương đơn độc vùng âm hộ phải. Sau đó được bác sĩ điều trị khám và tăng liều cotrimoxazol, đồng thời bổ sung doxycyclin do nghi ngờ viêm mô tế bào. Bệnh nhân thấy  ban đỏ quanh tổn thương giảm sau điều trị\n    - Tuy nhiên tổn thương tiếp tục tiến triển, xuất hiện nhiều bọng nước, lan rộng sang mông phải, đau nhiều, một số vị trí rỉ dịch vàng đục giống mủ.\n    - Khám tại phòng khám vào ngày nhập viện\n    - Được chuyển  đến Khoa Cấp cứu để khám và điều trị tiếp\n    Triệu chứng khi nhập viện\n    - tổn thương vùng âm hộ và mông bên phải\n    - Tổn thương cực kỳ đau đớn\n    - Tình trạng tổn thương dạng bóng nước ngày càng nặng\n    - Lan đến mông bên phải\n    - có dịch giống mủ có màu vàng  chảy ra từ tổn thương\n    Đặc điểm của triệu chứng\nTrả lời :\nChào bạn, trước hết xin được chia sẻ về sự lo lắng đôi chút về tình trạng của bé hiện này, về tình trạng bé mắc phải là dị tật thiểu sản vành tai và tịt ống tai ngoài bẩm sinh. Rất may mắn, cấu trúc tai trong đảm nhận chức năng thần kinh thính giác của con thường vẫn phát triển tốt. Việc bé phản xạ được âm thanh là nhờ sự bù trừ tuyệt vời từ chiếc tai trái khỏe mạnh.\n\nBạn hoàn toàn yên tâm vì y học hiện nay có phác đồ điều trị tương đối tốt . Về thẩm mỹ, khi bé từ 6 - 10 tuổi bác sĩ có thể phẫu thuật tạo hình vành tai bằng sụn sườn tự thân hoặc sụn nhân tạo, giúp con có đôi tai hoàn thiện. Về thính lực, dựa trên kết quả chụp cắt lớp đánh giá cấu trúc tai giữa, bé có thể được tạo hình ống tai ngoài hoặc dùng thiết bị trợ thính đường xương, truyền âm thanh xuyên qua hộp sọ thẳng vào tai trong.\n\n    - Được giới thiệu đến Khoa Cấp cứu để đánh giá thêm\n    - Bệnh nhân kiên quyết muốn tiếp tục sử dụng doxycyclinebactrim cho khả năng Viêm mô tế bào\n    - Cảm thấy rằng cô ấy đã có cải thiện do những loại thuốc này và không muốn ngừng chúng cho đến khi được bác sĩ Truyền nhiễm khám\n3.  Đánh giá tại bệnh viện\n    Các phát hiện chẩn đoán khác: Lo ngại về Nhiễm virus Herpes simplex (HSV) hoặc Bệnh thủy đậu/Zona (do Varicella Zoster Virus)","spans":[{"s":44,"e":56,"t":"Bệnh phổi kẽ","ty":"CHẨN_ĐOÁN","c":["J84.9"],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":68,"e":94,"t":"corticoid liều cao kéo dài","ty":"THUỐC","c":[],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":102,"e":117,"t":"Thở oxy tại nhà","ty":"THUỐC","c":[],"a":["isHistorical"],"st":"review","cat":"opus_only","d":{"o":{"type":"THUỐC","assertions":["isHistorical"],"candidates":[]},"s":null,"ot":"Thở oxy tại nhà","stx":null}},{"s":124,"e":162,"t":"Hội chứng kháng enzym tổng hợp protein","ty":"CHẨN_ĐOÁN","c":["M35.8"],"a":["isHistorical"],"st":"review","cat":"candidate_conflict","d":{"o":{"type":"CHẨN_ĐOÁN","assertions":["isHistorical"],"candidates":["M35.8"]},"s":{"type":"CHẨN_ĐOÁN","assertions":["isHistorical"],"candidates":[]},"ot":"Hội chứng kháng enzym tổng hợp protein","stx":"Hội chứng kháng enzym tổng hợp protein"}},{"s":170,"e":177,"t":"béo phì","ty":"CHẨN_ĐOÁN","c":["E66.9"],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":184,"e":209,"t":"Tăng huyết áp nguyên phát","ty":"CHẨN_ĐOÁN","c":["I10"],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":247,"e":273," ú lẫn ngày càng nặng\n    Thời điểm khởi phát triệu chứng: Cực kỳ yếu kể từ khi xuất viện\n    Diễn biến bệnh\n    - ảo giác được vợ nhận thấy\n    - Lú lẫn ngày càng nặng được vợ nhận thấy\nTổn thương mô bệnh học chủ yếu là tình trạng xâm nhập của tế bào một nhân kết hợp với lympho T và đại thực bào. Các tổn thương khó quan sát trên kính hiển vi quang học thông thường mà cần xem trên kính hiển vi điện tử. Các tế bào mast tăng số lượng vùng hạ bì với các mức độ thoát bọng khác nhau được quan sát thấy. Nhuộm huỳnh quang miễn dịch tổn thương sinh thiết không thấy có hình ảnh của lắng đọng các phức hợp miễn dịch, bổ thể hay sợi fibrin.\nĐối với bệnh lý mày đay vô căn, để lâu thường không có biến chứng gì nặng, chủ yếu bệnh làm ảnh hưởng tới chất lượng cuộc sống. Mày đay vô căn là một bệnh mạn tính, việc điều trị phải lâu dài và liên tục. Quá trình điều trị chỉ là điều trị triệu chứng.\nĐiều trị phụ thuộc vào mức độ nặng và bệnh lý nền có liên quan. Cần lưu ý cân bằng giữa hiệu quả điều trị kiểm soát triệu chứng và những tác dụng gây độc của liệu pháp điều trị. **************** thể hệ sau không gây buồn ngủ là lựa chọn hàng đầu sau đó đến **************** thể hệ 1, corticoid liều thấp cách ngày hoặc hàng ngày và giảm liều chậm 2,5 – 5mg mỗi 2-3 tuần. Nếu không đỡ hoặc có chống chỉ định, xin bạn hãy đến với bác sĩ chuyên khoa da liễu để có phương pháp điều trị tốt nhất.\nCảm ơn bạn đã gửi câu hỏi","spans":[{"s":85,"e":91,"t":"mề đay","ty":"CHẨN_ĐOÁN","c":["L50"],"a":[],"st":"review","cat":"type_conflict","d":{"o":{"type":"CHẨN_ĐOÁN","assertions":[],"candidates":["L50"]},"s":{"type":"TRIỆU_CHỨNG","assertions":[],"candidates":[]},"ot":"mề đay","stx":"mề đay"}},{"s":102,"e":106,"t":"ngứa","ty":"TRIỆU_CHỨNG","c":[],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":161,"e":167,"t":"mề đay","ty":"CHẨN_ĐOÁN","c":["L50"],"a":[],"st":"review", heo hệ thần kinh vào tủy sống và não, phá hủy các trung khu thần kinh trong đại não, \ngây ra trạng thái điên dại ở động vật và người.\nBệnh dại là bệnh đe dọa tính mạng và có thể gây tử vong cho người nếu người bị cắn không rửa vết thương và được điều trị y tế kịp thời sau khi bị cắn. Không có thuốc điều trị khi lên cơn dại. \nPhòng bệnh bằng tiêm *****************. Bệnh dại thường gia tăng vào mùa hè.\nBệnh dại gây ra bởi virus, và là bệnh lây truyền. Do vậy, việc phòng bệnh dại là vô cùng cần thiết.\n2. Bệnh dại lây truyền qua đường nào?\nVi-rút dại chủ yếu được lây truyền từ nước bọt của các loài động vật bị dại sang người qua vết cắn hoặc qua vết trầy xước trên cơ thể con người.\n- 96% các trường hợp gây bệnh dại ở người tại Đông Nam Á là do chó cắn. Nơi bị chó cắn càng gần thần kinh trung ương thì nạn nhân càng phát bệnh nhanh.\n- Thế giới ghi nhận việc lây bệnh qua không khí có thể xảy ra khi ở trong hang dơi hay tiếp xúc với chất thải của dơi,\n việc lây bệnh qua không khí này đã được ghi nhận tại 4 báo cáo về ca mắc bệnh dại ở người và liên quan tới công việc thí nghiệm với động vật. Tuy nhiên các ca mắc dạng này chưa ghi nhận tại Việt Nam.\n    Các thuốc đã thực hiện\n    - được cho bumetanide 2mg iv\n    - được cho vancomycin 1 gram\n    - được cho levofloxacin 750mg iv\nSố lượng vi rút dại xâm nhập vào\nTình trạng miễn dịch của bệnh nhân\nVùng bị cắn - vết thương ở đầu và cổ, cũng như những vết thương ở các khu vực đầu mút thần kinh như ngón tay, thường có thời gian ủ bệnh ngắn hơn do khoảng cách gần hơn cho vi rút xâm nhập vào mô thần kinh.\nTrường hợp của bạn nên đi đến các trung tâm tiêm chủng gần nhất để kiểm tra y tế và chích ngừa bạn nhé!","spans":[{"s":73,"e":95,"t":"bị thương nhẹ ở tay","ty":"TRIỆU_CHỨNG","c":[],"a":[],"st":"review","cat":"opus_only","d":{"o":{"type":"TRIỆU_CHỨNG","assertions":[],"candidates":[]},"s":null,"ot":"bị thương nhẹ ở tay","stx":null}},{"s":106,"e":116,"t":"chảy máu","ty":"TRIỆU_CHỨNG","c":[],"a" ,"t":"bệnh dại","ty":"CHẨN_ĐOÁN","c":["A82.9"],"a":[],"st":"review","cat":"candidate_conflict","d":{"o":{"type":"CHẨN_ĐOÁN","assertions":[],"candidates":["A82.9"]},"s":{"type":"CHẨN_ĐOÁN","assertions":[],"candidates":["A82"]},"ot":"bệnh dại","stx":"bệnh dại"}},{"s":2178,"e":2195,"t":"bumetanide 2mg iv","ty":"THUỐC","c":["1808"],"a":[],"st":"review","cat":"candidate_conflict","d":{"o":{"type":"THUỐC","assertions":[],"candidates":["1808"]},"s":{"type":"THUỐC","assertions":[],"candidates":[]},"ot":"bumetanide 2mg iv","stx":"bumetanide 2mg iv"}},{"s":2211,"e":2228,"t":"vancomycin 1 gram","ty":"THUỐC","c":["11124"],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":2244,"e":2265,"t":"levofloxacin 750mg iv","ty":"THUỐC","c":["82122"],"a":[],"st":"agreed","cat":"full_agree","d":null}]},"17":{"text":"Câu hỏi từ người dùng:\n\nchào bác sĩ, em 28 tuổi, dạo này em đánh răng hay chảy máu chân răng, miệng thấy hơi thở mùi khó chịu, kèm theo thấy nhiều mảng bám quanh răng nữa, bác sĩ tư vấn giúp em với.\n\nCâu trả lời của bác sĩ:\n\nChào bạn\nVấn đề của bạn nói nguy hiểm hay không nguy hiểm thì còn tùy một số trường hợp, các nguy cơ có thể xảy ra như sau:\nNguyên nhân:\n- Vệ sinh răng miệng kém: Đây được xem là nguyên nhân phổ biến gây ra chảy máu chân răng kèm hôi miệng. Nếu không vệ sinh răng miệng đúng cách sẽ tạo điều kiện cho vi khuẩn xâm nhập, gây tổn thương nướu và làm phát sinh mùi hôi.\n- Viêm quanh răng: Các mô bao quanh cuống răng bị viêm và sưng do nhiễm vi khuẩn, sang chấn răng. \n- Viêm nha chu: Đây là dạng nhiễm trùng lợi nặng, các triệu chứng gồm đau khi nhai, răng lung lay, sưng nướu, dễ chảy máu răng, hôi miệng, có mủ. Viêm nha chu nếu để kéo dài, chân răng có thể bị hư hại dẫn đến tình trạng mất răng hoặc viêm khớp dạng thấp, các bệnh hô hấp, đột quỵ,...\n- Thiếu canxi và vitamin: Thiếu hụt canxi dễ gây loãng xương, sâu răng và có nguy cơ bị viêm nha chu. Hôi miệng và chảy máu chân răng còn có thể do cơ thể thiếu hụt vitamin K.\n- Tiểu đường: Hôi miệng và chảy máu chân răng là dấu hiệu của bệnh tiểu đường. Nguyên nhân là do cơ thể sẽ giảm sản xuất insulin nên người bị tiểu đường suy yếu hệ miễn dịch, dễ gặp phải các vấn đề về răng miệng. Tình trạng khó đông máu khiến chân răng chảy máu kéo dài do nồng độ đường trong máu cao.\n- Tác dụng phụ của thuốc: Sử dụng một số loại thuốc có thể gây hôi miệng kèm chảy máu chân răng. Các loại thuốc gồm: Kháng histamin H1, thuốc chống trầm cảm, thuốc lợi tiểu, thuốc kháng sinh, thuốc chống nôn,..\n-Hút thuốc lá: Thành phần trong thuốc lá gây hỏng men răng, gai lưỡi phát triển quá mức khiến vi khuẩn xâm nhập, gây hôi miệng, chảy máu chân răng và mất răng.\n    - bệnh mạch máu ngoại biên\n    - bệnh phổi tắc nghẽn mạn tính\n    - Ngưng thở khi ngủ do tắc nghẽn đang dùng BiPAP\n    - Ung thư biểu mô tế bào vảy xâm nhập của dương vậtbiệt hóa kém, sau cắt bao quy đầu với bờ diện cắt dương tính.\n    Tiền sử phẫu thuật / thủ thuật\n•\tUống trà gừng và mật ong để loại bỏ vi khuẩn gây hại, khử mùi hôi do viêm, làm dịu niêm mạc, giảm sưng đau\n•\tTrà đinh hương giúp loại bỏ mùi hôi trong khoang miệng, ngăn ngừa chảy máu, giảm tình trạng chảy máu chân răng và hôi miệng.\n•\tThực hiện bào láng gốc răng để ngăn chặn quá trình tích tụ cao răng và hỗ trợ loại bỏ vi khuẩn gây viêm.\n•\tGhép mô mềm ở vòm họng vào vùng nướu bị ảnh hưởng để tái tạo mô và ổn định chân răng.\nĐể đảm bảo sức khỏe răng miệng, bạn nên đi khám răng miệng để biết nguyên nhân chính xác nhé!\n\n","spans":[{"s":74,"e":92,"t":"chảy máu chân răng","ty":"TRIỆU_CHỨNG","c":[],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":105,"e":125,"t":"hơi thở mùi khó chịu","ty":"TRIỆU_CHỨNG","c":[],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":147,"e":166,"t":"mảng bám quanh răng","ty":"TRIỆU_CHỨNG","c":[],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":384,"e":406,"t":"Vệ sinh răng miệng kém","ty":"CHẨN_ĐOÁN","c":[],"a":[],"st":"review","cat":"opus_only","d":{"o":{"type":"CHẨN_ĐOÁN",  lý của mô hoặc cơ quan. Cuối cùng, sự lắng đọng protein amyloid sẽ bắt đầu gây ra các triệu chứng và suy các cơ quan, thậm chí có thể gây tử vong.\nTình trạng lắng đọng của protein amyloid trong bệnh thoái hóa tinh bột có thể khu trú ở bất kỳ cơ quan nào trong cơ thể, chẳng hạn như phổi, da, bàng quang hoặc ruột hay có thể là toàn thân. Đây cũng là dạng phổ biến nhất. Mặc dù bệnh thoái hóa tinh bột không được xếp thành một loại ung thư, bệnh lại có thể liên quan đến một số bệnh ung thư máu như đa u tủy.\nCó nhiều loại amyloidosis khác nhau, bao gồm những loại sau:\n•        Bệnh amyloidosis chuỗi nhẹ\n•        Bệnh amyloidosis tự miễn dịch\n•        Bệnh amyloidosis di truyền hoặc gia đình\nBệnh thoái hóa tinh bột là một bệnh đa hệ thống dẫn đến nhiều biểu hiện lâm sàng khác nhau, Hiện nay chưa có phương pháp điều trị tận gốc amyloidosis.Tuy nhiên, các phương pháp điều trị có thể giúp bạn kiểm soát các triệu chứng bệnh cũng như ngăn chặn tổn thương \n    Các triệu chứng hiện tại\n    - đau bụng vùng hạ sườn phải\n    - chướng bụng \n    - buồn nôn thoáng qua\n    - Nôn mửa\n    - Bệnh nhân có  đau lưng âm ỉ\n    Đặc điểm triệu chứng\n    - Vị trí: đau bụng hạ sườn phải, đau lưng (khu trú vùng cạnh cột sống bên trái đoạn giữa lưng, đôi khi lan ra phía trước bụng.)\n    - Thời gian: Thường xuất hiện sau bữa ăn (đau bụng, chướng bụng)\n    - Các triệu chứng liên quan: chướng bụng,  buồn nôn thoáng qua, nôn, đau lưng kéo dài \n    Các sự kiện trước khi nhập viện\nBệnh nhân được nội soi thực quản - dạ dày - tá tràng ngoại trú, kết quả ghi nhận viêm dạ dày.\nĐã ngừng sử dụng thuốc NSAIDs.\nĐược điều trị bằng omeprazole.\nChụp cộng hưởng từ mật tụy  ghi nhận sỏi đoạn cuối ống mật chủ.\nXét nghiệm chức năng gan cho thấy men gan tăng.\nSau đó bệnh nhân đến khoa Cấp cứu để được đánh giá và điều trị tiếp\n.Đánh giá tại bệnh viện\nXét nghiệm:Xét nghiệm chức năng gan ghi nhận tăng men gan.\n","spans":[{"s":29,"e":57,"t":"Rối loạn chuyển hóa tinh bột","ty":"CHẨN_ĐOÁN","c":["E85" ốc còn khiến teo niêm mạc tử cung, không rụng trứng dẫn đến vô sinh. Nhiều trường hợp nguy hiểm còn gây ra ung thư cổ tử cung do dùng thuốc quá nhiều.\n-        Sử dụng nhiều ************************* khiến chị em tăng nguy cơ mang thai ngoài tử cung.\n-        Chị em sử dụng thuốc quá liều gây ảnh hưởng đến tim, mạch, gan, thận...\n-        Nồng độ hormone thay đổi nội tiết tố trong cơ thể gây ra các bệnh lý về da có thể xuất hiện nhiều mụn trứng cá, nám, tàn nhang, sạm da…\n-        Ảnh hưởng đến tâm trạng, cảm xúc, hay thấy bồn chồn, lo lắng, bứt rứt trong người, gây giảm ham muốn, lãnh cảm, suy giảm hưng phấn đối với tình dục, ảnh hưởng đến tình cảm gia đình.\n    Lý do nhập viện: xuất hiện nhiều  ban đỏ và đau khi sờ nắn ở vết mổ\n    Triệu chứng Bắt đầu\n    - sau khi xuất viện\n    - ống dẫn lưu JP được rút vào ngày DD MM\n    - bắt đầu có hiện tượng sưng nề đau khi sờ nắn trên vùng da kèm theo ban đỏ\n    Diễn biến bệnh\n    - tăng diện tích đau khi sờ nắn trên vùng da kèm theo ban đỏ\n    - đến khám tại phòng khám\n    - vùng da sưng nề được chọc hút dịch, gửi đi cấy mẫu bệnh phẩm\n    - được cho về vớ đơn thuốci levafloxacin và cephalexin\n    - tái khám với triệu chứng xuất hiện  ban đỏ lan rộng kèm theo chóng mặt\n    - được chuyển đến Khoa Cấp cứu\n    - Tại thời điểm khám bệnh  bệnh nhân có các triệu chứng tương tự\n    Triệu chứng hiện tại\n    -  ban đỏ xuất hiện nhiểu ở vị trí phẫu thuật\n    - đau khi sờ nắn vùng mổ\n    - chóng mặt\n    - không sốt\n    - hiện tại chưa phát hiện các triệu chứng toàn thân khác\n3.  khám tại bệnh viện\n    Dấu hiệu lâm sàng\n    - ban đỏ ở vị trí phẫu thuật\n","spans":[{"s":58,"e":68,"t":"**********","ty":"THUỐC","c":[],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":138,"e":148,"t":"**********","ty":"THUỐC","c":[],"a":[],"st":"review","cat":"assertion_conflict","d":{"o":{"type":"THUỐC","assertions":[],"candidates":[]},"s":{"type":"THUỐC","assertions":["isHistorical"],"candidates":[]},"ot":"**********","stx": 1. Bệnh mạch vành là gì? \n\nBệnh mạch vành là tình trạng hẹp hoặc tắc các động mạch vành – những mạch máu có nhiệm vụ nuôi dưỡng cơ tim. Nguyên nhân chủ yếu là xơ vữa động mạch, làm giảm tưới máu cơ tim, gây thiếu oxy cơ tim, từ đó dẫn đến đau thắt ngực, nhồi máu cơ tim, suy tim hoặc đột tử .\n\n2. Nguyên nhân và cơ chế bệnh sinh \n\nNguyên nhân chính\n\nXơ vữa động mạch vành:\n • LDL-cholesterol tăng\n • Lắng đọng lipid → hình thành mảng xơ vữa\n • Mảng xơ vữa to dần → hẹp lòng mạch\n • Nứt vỡ mảng xơ vữa → huyết khối → tắc mạch cấp \n\nYếu tố nguy cơ\n\nKhông thay đổi được\n • Tuổi cao \n • Nam giới\n • Tiền sử gia đình bệnh tim mạch sớm\n\nCó thể thay đổi\n • Hút thuốc lá \n • Tăng huyết áp\n • Đái tháo đường \n • Rối loạn lipid máu\n • Béo phì, ít vận động\n • Stress kéo dài \n\nTriệu chứng lâm sàng \n\nĐau thắt ngực (triệu chứng điển hình)\n\nVị trí: sau xương ức\nTính chất: đè nặng, bóp nghẹt, thắt chặt\nLan: vai trái – cánh tay trái – cổ – hàm dưới\nThời gian: vài phút\nGiảm khi nghỉ hoặc dùng nitroglycerin\nCác thể lâm sàng\n\nĐau thắt ngực ổn định\n • Xảy ra khi gắng sức\n • Giảm khi nghỉ\n\nHội chứng vành cấp\n • Đau dữ dội, kéo dài\n • Không đỡ khi nghỉ\n • Gồm:\n • Nhồi máu cơ tim ST chênh\n • Nhồi máu không ST chênh\n • Đau thắt ngực không ổn định\n\nTriệu chứng không điển hình (hay gặp ở nữ, người già, ĐTĐ):\n • Khó thở\n • Mệt\n • Buồn nôn\n • Đau thượng vị\n\n\n4. Chẩn đoán \n\nLâm sàng\n • Khai thác đau ngực + yếu tố nguy cơ\n\n1.  Tiền sử bệnh\n    bệnh nhân có tiền sử nhập viện gần đây vìviêm tụy\n    Bệnh lý mãn tính\n    - tiền sử rung nhĩ\n    - phẫu thuật cắt bỏ tuyến tiền liệt (u ác của tuyến tiền liệt)\n    - rối loạn cảm xúc lưỡng cực khác\n    Tiền sử phẫu thuật / thủ thuật: phẫu thuật cắt bỏ tuyến tiền liệt (u ác của tuyến tiền liệt)\n    Thuốc trước khi nhập viện: đang dùng eliquis (cho rung nhĩ)\n2.  Tiền sử bệnh hiện tại\n    Lý do nhập viện: sốt và đau bụng\n    Thời điểm khởi phát triệu chứng\n    - khởi phát đau bụng trên (lần nhập viện trước)\n    - Hôm nay, bệnh nhân có sốt nhẹ đến 38.3°C kèm theo đau hạ sườn phải tái phát, ngày càng nặng hơn.\n    Diễn biến bệnh\nTập thể dục ≥ 150 phút/tuần\nKhông hút thuốc\nGiữ cân nặng hợp lý\nGiảm stress\nKiểm soát HA – đường huyết – lipid\n\nDự phòng thứ phát (đã mắc bệnh)\n\nUống thuốc đều\nTái khám định kỳ\nKiểm soát LDL \u003c 1,8 mmol/L (hoặc \u003c70 mg/dL)\nNhận biết sớm dấu hiệu đau ngực","spans":[{"s":1,"e":15,"t":"BỆNH MẠCH VÀNH","ty":"CHẨN_ĐOÁN","c":["I25.1"],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":17,"e":40,"t":"Coronary Artery Disease","ty":"CHẨN_ĐOÁN","c":["I25.1"],"a":[],"st":"review","cat":"opus_only","d":{"o":{"type":"CHẨN_ĐOÁN","assertions":[],"candidates":["I25.1"]},"s":null,"ot":"Coronary Artery Disease","stx":null}},{"s":43,"e":46,"t":"CAD","ty":"CHẨN_ĐOÁN","c":["I25.1"],"a":[],"st":"review","cat":"opus_only","d":{"o":{"type":"CHẨN_ĐOÁN","assertions":[],"candidates":["I25.1"]},"s":null,"ot":"CAD","stx":null}},{"s":52,"e":66,"t":"Bệnh mạch vành","ty":"CHẨN_ĐOÁN","c":["I25.1"],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":76,"e":90,"t":"Bệnh mạch vành","ty":"CHẨN_ĐOÁN","c":["I25.1"],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":208,"e":224,"t":"xơ vữa động mạch","ty":"CHẨN_ĐOÁN","c":["I70.9"],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":256,"e":272,"t":"thiếu oxy cơ tim","ty":"CHẨN_ĐOÁN","c":[],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":288,"e":301,"t":"đau thắt ngực","ty":"TRIỆU_CHỨNG","c":[],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":303,"e":318,"t":"nhồi máu cơ tim","ty":"CHẨN_ĐOÁN","c":["I21.9"],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":320,"e":327,"t":"suy tim","ty":"CHẨN_ĐOÁN","c":["I50.9"],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":333,"e":339,"t":"đột tử","ty":"CHẨN_ĐOÁN","c":["I46.1"],"a":[],"st":"review","cat":"candidate_conflict","d":{"o":{"type":"CHẨN_ĐOÁN","assertions":[],"candidates":["I46.1"]},"s":{"type":"CHẨN_ĐOÁN","assertions"  - nhìn mờ: tiến triển trong 2 tuần qua, bên trái nặng hơn bên phải\n    - đau đầu: nhiều hơn\n    Sự kiện trước khi nhập viện\n    - Được bác sĩ nhãn khoa [Name] khám ngoại trú hôm nay\n    - Được bác sĩ nhãn khoa giới thiệu đến Khoa Cấp cứu vì phù gai thị, bên trái nặng hơn bên phải\n3.  Đánh giá tại bệnh viện\n    Dấu hiệu lâm sàng: Phù gai thị, bên trái nặng hơn bên phải (theo báo cáo của bác sĩ nhãn khoa)\n    Các phát hiện chẩn đoán khác\n    - Tăng nhãn áp so với chụp cắt lớp vi tính (ct) đầu từ [Date] (từ lần nhập viện trước)\n- Có nhiều nang chứa khí hay dịch nhỏ (\u003c2cm) (Trong khi áp-xe phổi kích thước ổ hoại tử trên 2cm, vách dày > 2mm)\nChúc bạn học tập tốt!","spans":[{"s":20,"e":37,"t":"viêm phổi hoại tử","ty":"CHẨN_ĐOÁN","c":["J85.0"],"a":[],"st":"review","cat":"candidate_conflict","d":{"o":{"type":"CHẨN_ĐOÁN","assertions":[],"candidates":["J85.0"]},"s":{"type":"CHẨN_ĐOÁN","assertions":[],"candidates":[]},"ot":"viêm phổi hoại tử","stx":"viêm phổi hoại tử"}},{"s":20,"e":29,"t":"viêm phổi","ty":"CHẨN_ĐOÁN","c":["J18.9"],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":116,"e":126,"t":"áp xe phổi","ty":"CHẨN_ĐOÁN","c":["J85.2"],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":135,"e":137,"t":"VP","ty":"CHẨN_ĐOÁN","c":["J18.9"],"a":[],"st":"review","cat":"candidate_conflict","d":{"o":{"type":"CHẨN_ĐOÁN","assertions":[],"candidates":["J18.9"]},"s":{"type":"CHẨN_ĐOÁN","assertions":[],"candidates":[]},"ot":"VP","stx":"VP"}},{"s":141,"e":145,"t":"VPHT","ty":"CHẨN_ĐOÁN","c":["J85.0"],"a":[],"st":"review","cat":"candidate_conflict","d":{"o":{"type":"CHẨN_ĐOÁN","assertions":[],"candidates":["J85.0"]},"s":{"type":"CHẨN_ĐOÁN","assertions":[],"candidates":[]},"ot":"VPHT","stx":"VPHT"}},{"s":211,"e":220,"t":"Viêm phổi","ty":"CHẨN_ĐOÁN","c":["J18.9"],"a":[],"st":"agreed","cat":"full_agree","d":null},{"s":235,"e":248,"t":"viêm phế quản","ty":"CHẨN_ĐOÁN","c":["J20.9"],"a":[],"st":"review","cat":"candidate_conflict","d":{"o":{"type":"CHẨN_ĐOÁN","assertion  chẩn đoán giãn thừng tinh 2.5mm 1 bên, đã khám và điều trị thuốc uống 5 tuần, độ giãn không giảm, thỉnh thoảng đau nhẹ, cảm thấy nóng phần tinh hoàn, đã ngừng dùng thuốc, vì tình hình covid không thể vào hcm để vào chuyên khoa khám , nhờ quý bác sĩ tư vấn được không ạ, để lâu em sợ ảnh hưởng tinh trùng ảnh hưởng sinh sản ạ\n\nCâu trả lời của bác sĩ: \n\nChào bạn. Giãn thừng tinh là một trong nhiều nguyên nhân gây vô sinh thứ phát. Với thông tin mà bạn cung cấp thì hãy đến tái khám tại BV tuyến tỉnh nơi bạn sinh sống để được bs chuyên khoa đưa ra chỉ định điều trị phẫu thuật phù hợp nhé. Hầu hết bv tuyến tỉnh đều có thể điều trị phẫu thuật giãn thừng tinh hiệu quả. Chúc bạn nhiều sức khoẻ.    Các triệu chứng hiện tại\n    - đau bụng vùng hạ sườn phải\n    - chướng bụng \n    - buồn nôn thoáng qua\n    - Nôn mửa\n    - Bệnh nhân có  đau lưng âm ỉ\n    Đặc điểm triệu chứng\n    - Vị trí: đau bụng hạ sườn phải, đau lưng (khu trú vùng cạnh cột sống bên trái đoạn giữa lưng, đôi khi lan ra phía trước bụng.)\n    - Thời gian: Thường xuất hiện sau bữa ăn (đau bụng, chướng bụng)\n    - Các triệu chứng liên quan: chướng bụng,  buồn nôn thoáng qua, nôn, đau lưng kéo dài \n    Các sự kiện trước khi nhập viện\nBệnh nhân được nội soi thực quản - dạ dày - tá tràng ngoại trú, kết quả ghi nhận viêm dạ dày.\nĐã ngừng sử dụng thuốc NSAIDs.\nĐược điều trị bằng omeprazole.\nChụp cộng hưởng từ mật tụy  ghi nhận sỏi đoạn cuối ống mật chủ.\nXét nghiệm chức năng gan cho thấy men gan tăng.\nSau đó bệnh nhân đến khoa Cấp cứu để được đánh giá và điều trị tiếp\n.Đánh giá tại bệnh viện\nXét nghiệm:Xét nghiệm chức năng gan ghi nhận tăng men gan.\nChẩn đoán hình ảnh và thăm dò:Nội soi thực quản - dạ dày - tá tràng: viêm dạ dày.\nCộng hưởng từ mật tụy : sỏi đoạn cuối ống mật chủ.\nThủ thuật được thực hiện   :Nội soi mật tụy ngược dòng (ERCP). Trong quá trình ERCP, lấy thành công 02 viên sỏi tại đoạn cuối ống mật chủ (CBD).\n    - chụp cộng hưởng từ mật tụy tụi mật được thực hiện cho thấy sỏi ống dẫ  tuần trước khi nhập viện\n    Triệu chứng hiện tại\n\nMột tuần nay em bị đau bụng vùng thượng vị, ợ hơi, ợ chua. Em đã đi nội soi dạ dày thì được biết là hang vị, tiền môn vị, niêm mạc phù nề, sung huyết đỏ. Xin hỏi bác sĩ bệnh có nguy hiểm không? Cần làm gì để điều trị dứt điểm. Em dùng nghệ mật ong có tốt không?\n    - mệt mỏi\n    - sốt lên đến 101\n    - thỉnh thoảng tiêu chảy các thuốc của ông ấy\n    - đi tiểu nhiều lần vào ban đêm, không có đau buốt khi đi tiểu\n    Đặc điểm triệu chứng\n    - khó thở khi gắng sức bao gồm cảm giác khó thở sau khi đi bộ vài khối\n    - ho đặc như bã theo lời bệnh nhân nhưng ông ấy không khạc nhổ gì\n    - sốt lần cuối sốt là vào ngày\n    - tiêu chảy đã tự khỏi vào buổi sáng hôm sau\n    - Phủ nhận đau ngực\n    - Phủ nhận buồn nôn/nôn\n    - Phủ nhận đổ mồ hôi đêm\n    - Phủ nhận khó thở khi nằm\n    - Phủ nhận khó thở khi nằm đột ngột (paroxysmal nocturnal dyspnea)\n    Sự kiện trước khi nhập viện\n    - Vợ có các triệu chứng tương tự 3 tuần trước, được chẩn đoán là giãn phế quản, phản ứng tốt với azithromycin\n    - Tự điều trị bằng tylenol và mucinex d\n    - Đi khám bác sĩ chăm sóc chính (PCP) vào buổi sáng ngày nhập viện\n    - Bác sĩ PCP ghi nhận spo2 là 90-92% spo2 khi thở khí trời, 93% khi không dùng oxy\n    - Bác sĩ PCP đã gửi bệnh nhân  đến phòng cấp cứu\n\n3.  Đánh giá tại bệnh viện\n    Kết quả xét nghiệm\n    - số lượng bạch cầu là 12.5\n    - tổng phân tích nước tiểu đáng chú ý chỉ có vếtvết protein niệu.  \n    - troponin âm tính x1\n    Kết quả chẩn đoán hình ảnh: chụp x-quang ngực được cho là viêm phổi thùy dưới phải (RLL PNA)","spans":[{"s":51,"e":53,"t":"ho","ty":"TRIỆU_CHỨNG","c":[],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":54,"e":68,"t":"đái tháo đường","ty":"CHẨN_ĐOÁN","c":["E11"],"a":["isHistorical"],"st":"agreed","cat":"full_agree","d":null},{"s":75,"e":88,"t":"tăng huyết áp","ty":"CHẨN_ĐOÁN","c":["I10"],"a":["isHistorical"],"st":"agreed","cat":"fu <script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const SHORT = {"TRIỆU_CHỨNG":"TC","TÊN_XÉT_NGHIỆM":"XN","KẾT_QUẢ_XÉT_NGHIỆM":"KQ",
               "CHẨN_ĐOÁN":"CĐ","THUỐC":"T"};
const KEY   = {"TRIỆU_CHỨNG":"TC","TÊN_XÉT_NGHIỆM":"XN","KẾT_QUẢ_XÉT_NGHIỆM":"KQ",
               "CHẨN_ĐOÁN":"CD","THUỐC":"TH"};
const LABEL = {"TRIỆU_CHỨNG":"Triệu chứng","TÊN_XÉT_NGHIỆM":"Tên XN",
               "KẾT_QUẢ_XÉT_NGHIỆM":"Kết quả","CHẨN_ĐOÁN":"Chẩn đoán","THUỐC":"Thuốc"};
const CATVI = {"candidate_conflict":"lệch mã ứng viên","type_conflict":"lệch nhãn",
               "boundary_conflict":"lệch ranh giới span","assertion_conflict":"lệch assertion",
               "opus_only":"chỉ opus-5 bắt được","sonnet_only":"chỉ sonnet-5 bắt được"};
const TYPES = Object.keys(SHORT);
const FIDS  = Object.keys(DATA.files).sort((a,b)=>(+a)-(+b));

let fid = FIDS[0], active = new Set(TYPES), revOnly = false, sel = null;

const $ = id => document.getElementById(id);
$('sub').textContent = DATA.meta.n_files + ' file · ' + DATA.meta.n_spans +
  ' mention · ' + DATA.meta.n_agreed + ' đồng thuận, ' + DATA.meta.n_review +
  ' cần phân xử · hợp nhất ' + DATA.meta.models.join(' × ');

FIDS.forEach(f => {
  const o = document.createElement('option');
  o.value = f; o.textContent = f + '.txt';
  $('sel').appendChild(o);
});

TYPES.forEach(t => {
  const c = document.createElement('span');
  c.className = 'chip'; c.dataset.k = KEY[t]; c.dataset.t = t;
  c.textContent = LABEL[t];
  c.onclick = () => {
    active.has(t) ? active.delete(t) : active.add(t);
    c.classList.toggle('off', !active.has(t));
    render();
  };
  $('chips').appendChild(c);
});

function visible(sp){
  return active.has(sp.ty) && (!revOnly || sp.st === 'review');
}

function render(){
  const F = DATA.files[fid];
  const spans = F.spans.map((sp,i) => Object.assign({_i:i}, sp)).filter(visible);
  const cuts = new Set([0, F.text.length]);
  spans.forEach(sp => { cuts.add(sp.s); cuts.add(sp.e); });
  const pts = [...cuts].sort((a,b) => a-b);

  const doc = $('doc');
  doc.textContent = '';
  for (let i = 0; i < pts.length - 1; i++){
    const p = pts[i], q = pts[i+1];
    if (q <= p) continue;
    const txt = F.text.slice(p, q);
    const cov = spans.filter(sp => sp.s <= p && sp.e >= q)
                     .sort((a,b) => (b.e-b.s) - (a.e-a.s));
    doc.appendChild(build(txt, cov, 0, q));
  }
  const n = spans.length, rv = spans.filter(s => s.st === 'review').length;
  const by = {};
  spans.forEach(s => by[s.ty] = (by[s.ty]||0) + 1);
  $('stats').innerHTML =
    '<span>hiện <b>' + n + '</b> mention</span>' +
    '<span>đồng thuận <b>' + (n-rv) + '</b></span>' +
    '<span>cần phân xử <b>' + rv + '</b></span>' +
    TYPES.filter(t => by[t]).map(t =>
      '<span>' + LABEL[t] + ' <b>' + by[t] + '</b></span>').join('');
  if (sel !== null){
    const el = doc.querySelector('.ent[data-i="' + sel + '"]');
    if (el) el.classList.add('sel'); else { sel = null; detail(null); }
  }
}

function build(text, cov, k, segEnd){
  if (k >= cov.length) return document.createTextNode(text);
  const sp = cov[k];
  const el = document.createElement('span');
  el.className = 'ent ent-' + KEY[sp.ty] + (sp.st === 'review' ? ' rev' : '');
  el.dataset.i = sp._i;
  el.appendChild(build(text, cov, k+1, segEnd));
  if (sp.e === segEnd){
    const b = document.createElement('sup');
    b.className = 'bdg'; b.textContent = SHORT[sp.ty];
    el.appendChild(b);
  }
  return el;
}

function codes(list, ty){
  if (!list || !list.length)
    return '<span class="none">— ' +
      (ty === 'CHẨN_ĐOÁN' || ty === 'THUỐC'
        ? 'không có mã ứng viên' : 'không ánh xạ mã cho loại này') + '</span>';
  return list.map(c => {
    const nm = DATA.names[c];
    return '<span class="code">' + esc(c) + (nm ? ' <i>· ' + esc(nm) + '</i>' : '') + '</span>';
  }).join('');
}

function esc(s){
  return String(s).replace(/[&<>"]/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}

function side(o){
  if (!o) return '<span class="none">— không đề xuất span này</span>';
  return '<span class="pill pill-' + KEY[o.type] + '">' + esc(o.type) + '</span>' +
    '<div class="m" style="margin-top:5px">mã: ' +
    (o.candidates.length ? o.candidates.map(esc).join(', ') : '—') +
    ' · assertion: ' + (o.assertions.length ? o.assertions.map(esc).join(', ') : '—') +
    '</div>';
}

function detail(sp){
  const d = $('det');
  if (!sp){
    d.innerHTML = '<div class="none" style="font-size:13.5px;padding-top:34px;' +
      'text-align:center">Bấm vào một khái niệm được tô màu ở trên để xem chi tiết.</div>';
    return;
  }
  let h = '';
  h += '<div class="row"><div class="k">TEXT</div><div class="v"><span class="q">"' +
       esc(sp.t) + '"</span></div></div>';
  h += '<div class="row"><div class="k">TYPE</div><div class="v">' +
       '<span class="pill pill-' + KEY[sp.ty] + '">' + esc(sp.ty) + '</span>' +
       ' <span class="none">— ' + LABEL[sp.ty] + '</span></div></div>';
  h += '<div class="row"><div class="k">CANDIDATES</div><div class="v">' +
       codes(sp.c, sp.ty) + '</div></div>';
  h += '<div class="row"><div class="k">ASSERTIONS</div><div class="v">' +
       (sp.a.length ? sp.a.map(a => '<span class="code">' + esc(a) + '</span>').join('')
                    : '<span class="none">— không có</span>') + '</div></div>';
  h += '<div class="row"><div class="k">VỊ TRÍ</div><div class="v">' +
       '<span class="code">[' + sp.s + ', ' + sp.e + ']</span></div></div>';
  h += '<div class="row"><div class="k">TRẠNG THÁI</div><div class="v">' +
       (sp.st === 'agreed'
         ? '<span class="tag tag-ok">hai model đồng thuận</span>'
         : '<span class="tag tag-rv">cần phân xử — ' + (CATVI[sp.cat] || sp.cat) + '</span>');
  if (sp.d){
    const D = sp.d, bd = sp.cat === 'boundary_conflict';
    h += '<div class="diff"><table><tr><th style="width:96px">model</th>' +
         '<th style="width:34%">span</th><th>nhãn / mã / assertion</th></tr>' +
         '<tr><td class="m">opus-5</td><td class="m' + (bd ? ' hl' : '') + '">' +
         (D.ot ? '"' + esc(D.ot) + '"' : '<span class="none">—</span>') + '</td><td>' +
         side(D.o) + '</td></tr>' +
         '<tr><td class="m">sonnet-5</td><td class="m' + (bd ? ' hl' : '') + '">' +
         (D.stx ? '"' + esc(D.stx) + '"' : '<span class="none">—</span>') + '</td><td>' +
         side(D.s) + '</td></tr></table></div>';
  }
  h += '</div></div>';
  d.innerHTML = h;
}

$('doc').addEventListener('click', e => {
  const el = e.target.closest('.ent');
  document.querySelectorAll('.ent.sel').forEach(x => x.classList.remove('sel'));
  if (!el){ sel = null; detail(null); return; }
  el.classList.add('sel');
  sel = +el.dataset.i;
  detail(DATA.files[fid].spans[sel]);
});

function goto(f){
  fid = f; sel = null; $('sel').value = f;
  $('prev').disabled = FIDS.indexOf(f) === 0;
  $('next').disabled = FIDS.indexOf(f) === FIDS.length - 1;
  detail(null); render();
  $('doc').scrollIntoView({block:'nearest'});
}

$('sel').onchange = e => goto(e.target.value);
$('prev').onclick = () => { const i = FIDS.indexOf(fid); if (i > 0) goto(FIDS[i-1]); };
$('next').onclick = () => { const i = FIDS.indexOf(fid); if (i < FIDS.length-1) goto(FIDS[i+1]); };
$('revonly').onchange = e => { revOnly = e.target.checked; render(); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft')  $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
});

goto(FIDS[0]);
</script>
</body>
</html>
