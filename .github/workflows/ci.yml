name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # Tất định: mọi chỗ sinh id phải sort tường minh, nhưng khoá luôn hash seed
  # để không có nguồn ngẫu nhiên nào lọt vào artifact (§6.3).
  PYTHONHASHSEED: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cài đặt
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Test
        # Bỏ qua test cần dữ liệu thô 9 GB — không có trên runner.
        run: pytest -m "not slow"

      - name: Schema áp được sạch
        run: python -c "import sqlite3, smart_medic.kb.schema.version as v; sqlite3.connect(':memory:').executescript(v.read_ddl())"

      - name: CLI phơi đủ lệnh con
        run: smk kb --help
