#          nghiệm đi kèm (dấu `:` hoặc một giá trị ngay sau) — xem
#          `labtest.CatalogMatcher`. Không có ràng buộc đó thì `N`, `HA`, `SA`
#          sẽ bắn vào mọi chỗ.
