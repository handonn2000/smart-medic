  - thuốc hạ sốt
  - thuốc kháng nấm
  - thuốc kháng virus
  - thuốc kháng viêm
  - thuốc ngủ
  - thuốc an thần
  - thuốc tránh thai
  - thuốc nhuận tràng
  - thuốc bổ
  - thuốc nam
  - thuốc bắc
  - thuốc đông y
  - kháng histamin
  - kháng histamin h1
  - corticoid
