# ─────────────────────────────────────────────────────────────────────────────
# 5 · LÀN `TÊN: giá trị` TỔNG QUÁT — cho 94/100 file test
#
# Gold là corpus `restyled/` tổng hợp và gần như không có dòng `TÊN: giá trị`
# (đo được: chỉ 12,6% TÊN_XÉT_NGHIỆM của gold trùng khít nhãn của một LayoutUnit).
# Tập test thì có, ở 94/100 file. Nên làn này gần như KHÔNG ghi điểm trên gold mà
# vẫn phải đúng — nó là làn mang tập test. Vì thế nó siết chặt: một nhãn lạ chỉ
# được nhận là tên xét nghiệm khi GIÁ TRỊ của nó trông như một phép đo.
unknown_label_requires_measurement: true
label_max_tokens: 6
