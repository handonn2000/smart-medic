# ── Từ vựng KẾT QUẢ ───────────────────────────────────────────────────────
#
# ★ Đây là phần đóng khoảng trống lớn nhất. `_MEASURE` là regex *số + đơn vị*,
#   nên **không thể** chạm tới 5 lớp dưới đây — đó là gốc của recall 0,424
#   (`docs/synth-corpus-plan-v2.md` §0.3 mục D).
result_vocab:
  # Định tính
  qualitative:
    - "dương tính"
    - "âm tính"
    - "dương tính yếu"
    - "nghi ngờ"
    - "(+)"
    - "(-)"
    - "(±)"
    - "+"
    - "-"

  # Mô tả BÌNH THƯỜNG — thường là cả mệnh đề
  normal:
    - "bình thường"
    - "trong giới hạn bình thường"
    - "trong ngưỡng bình thường"
    - "chưa phát hiện bất thường"
    - "không phát hiện bất thường"
    - "không có bất thường"
    - "nguyên vẹn"
    - "không ghi nhận bất thường"
    - "kết quả bình thường"

  # Xu hướng — đầu cụm, phần đuôi để regex nuốt tới ranh giới câu
  trend_heads:
    - "tăng"
    - "giảm"
    - "cải thiện"
    - "xấu đi"
    - "ổn định"
    - "cao"
    - "thấp"
    - "rối loạn"

  # Trạng thái quy trình — không phải giá trị nhưng gold vẫn gán KẾT_QUẢ
  pending:
    - "đang chờ"
    - "chưa có kết quả"
    - "đang chờ kết quả"
    - "chưa làm"

# ── Nối TÊN với KẾT QUẢ bằng văn xuôi ─────────────────────────────────────
#
# Đo trên gold (gold_real | gold_batch1): dấu ngăn `": "` 10|57 · `" "` 8|85 ·
# văn xuôi 6|~19 · xuống dòng+gạch đầu dòng 2|~2.
# Nhánh văn xuôi ít lượt nhất nhưng là nhánh DUY NHẤT bắt được kết quả mô tả dài.
prose_separators:
  - " cho thấy "
  - " cho kết quả "
  - " kết quả là "
  - " ghi nhận "
  - " phát hiện "
  - " đo được là "
  - " là cao tới "
  - " là tăng lên ở mức "
  - " là giảm xuống "
  - " là "

# Ranh giới PHẢI cắt kết quả — mệnh đề diễn giải, không thuộc kết quả.
# Đo được: gold cắt `"túi mật căng to với dịch quanh túi mật"` ngay trước
# `" gợi ý viêm túi mật cấp"`.
result_stop_phrases:
  - " gợi ý "
  - " nghĩ đến "
  - " phù hợp với "
  - " chẩn đoán "
  - " do "

# ── Đơn vị bổ sung cho `_MEASURE` ─────────────────────────────────────────
# Thiếu `micromol/l` là lý do `"Creatinin: 89 micromol/l"` trượt ở `24.txt`.
extra_units:
  - "micromol/l"
  - "µmol/L"
  - "umol/L"
  - "mmol/L"
  - "nmol/L"
  - "U/l"
  - "IU/l"
  - "T/L"
  - "G/l"
  - "K/uL"
  - "x10^9/L"
  - "10^9/L"
  - "ml/24h"
  - "l/phút"
  - "cm"
  - "mm"
  - "mmHg"
  - "kg/m2"
