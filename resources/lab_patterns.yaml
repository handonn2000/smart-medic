# ─────────────────────────────────────────────────────────────────────────────
# 3b · TÊN CHỈ TÍNH KHI CÓ GIÁ TRỊ ĐI SAU
#
# Đây là danh sách sửa lỗi ĐO ĐƯỢC, không phải đề phòng lý thuyết. Chạy trên 162
# file gold, làn từ vựng sinh 402 span TÊN_XÉT_NGHIỆM rác, và phần lớn tập trung ở
# vài từ vừa là tên xét nghiệm vừa là từ thường:
#
#     mạch      136 rác  — 'mạch' là tên (pulse), nhưng trong 'bệnh mạch vành' và
#                          'Tim mạch' nó là một phần của chẩn đoán/tên khoa
#     phân       12 rác  — 'phân' (stool) so với 'phân' trong 'đi tiêu phân cứng'
#     nhịp tim   13 rác  — 'Nhịp tim đều, click cơ học' là mô tả khám, không phải
#                          một phép đo có giá trị
#
# Với những từ này, BẰNG CHỨNG là một giá trị đi sau. `M 67` là phép đo; `Tim mạch`
# thì không. Tên trong `names_require_value` chỉ được phát khi `separator` +
# `value` khớp ngay sau nó — cùng đúng một luật mà `abbreviations` đã dùng.
names_require_value:
  - mạch
  - phân
  - nước tiểu
  - thở
  - nhiệt
  - cân
  - nhịp tim
  - nhịp thở
  - huyết áp
  - lipid
  - kali
  - natri
  - canxi
  - clo
  - đường
  - protein
  - albumin
  - đồng tử
  - dáng đi

# Không bao giờ là tên xét nghiệm. Đây là từ chỉ VIỆC xét nghiệm hoặc tiêu đề mục,
# không phải một phép đo — 'các xét nghiệm như CAT scan' không có giá trị nào.
# Đo được: 'xét nghiệm' 114 span rác, 'sinh hiệu' 10.
names_never:
  - xét nghiệm
  - xét nghiệm máu
  - các xét nghiệm
  - kết quả
  - kết quả xét nghiệm
  - kq
  - kq xn
  - xn
  - sinh hiệu
  - dấu sinh tồn
  - chỉ số
  - thông số
  - mức
  - nồng độ
  - tỷ lệ
  - giá trị

# Viết tắt. PHÂN BIỆT HOA THƯỜNG, và chỉ được nhận khi có một GIÁ TRỊ đi liền sau
# — nếu không thì `M` khớp mọi chữ M trong tài liệu và `T` khớp mọi chữ T.
# Ví dụ thật trong gold: `Dấu sinh tồn: M67 HA 159/49 không sốt thở 18.`
# ⇒ `M` là tên, `67` là kết quả, dính liền nhau không có khoảng trắng.
abbreviations:
  - HA        # huyết áp
  - BP
  - M         # mạch
  - NT        # nhịp tim / nhịp thở
  - HR
  - RR
  - T         # nhiệt độ (temperature)
  - P         # pulse
  - Wt
  - Ht
  - BMI
  - EF
  - SpO2
  - O2
  - BC        # bạch cầu
  - HC
  - TC
  - H&H
  - CO2
  - C3
  - C4
abbreviation_requires_value: true
abbreviation_max_chars: 4

# ─────────────────────────────────────────────────────────────────────────────
# 4 · NHÃN KHÔNG PHẢI TÊN XÉT NGHIỆM
#
# Cổng chặn của làn `TÊN: giá trị` tổng quát. `Chẩn đoán: viêm phổi` có đúng hình
# dạng của một dòng xét nghiệm và KHÔNG phải một dòng xét nghiệm; nhận nó là tự
# tạo ra hai span sai type, và sai type bị phạt HAI LẦN (một span rác + một entity
# bỏ sót) trên cả ba số hạng.
#
# So khớp: nhãn của LayoutUnit, không phân biệt hoa thường, sau khi bỏ dấu.
non_lab_labels:
