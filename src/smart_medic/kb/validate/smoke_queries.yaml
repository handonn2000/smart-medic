# Truy vấn khói — chạy mỗi lần build.
#
# Đây là loại test giá trị nhất của cả pipeline: rẻ, và bắt được ngay khi một
# thay đổi ở `normalize/` vô tình phá retrieval. Mention lấy từ `data/test/`,
# từ ví dụ trong PRD, và từ các bệnh phổ biến ở hồ sơ lâm sàng Việt Nam.
#
# `expect_prefix` chứ không phải mã chính xác: ICD có nhiều mã con cho cùng một
# bệnh (K21 / K21.0 / K21.9), khớp ở mức nhóm đã là đúng cho mục đích canh gác.

- query: "trào ngược dạ dày"          # ví dụ trong PRD
  vocab: icd10
  expect_prefix: "K21"
- query: "bệnh trào ngược dạ dày - thực quản"
  vocab: icd10
  expect_prefix: "K21"
- query: "thiếu men G6PD"             # 1.txt — ca "mention rút gọn" của PRD §7
  vocab: icd10
  expect_prefix: "D55"
