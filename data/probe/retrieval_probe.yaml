# Probe set — đo NĂNG LỰC TRUY HỒI của KB, không phải đo pipeline giải bài.
#
# Rẻ hơn gold annotation rất nhiều vì chỉ cần cặp `(mention → mã đúng)`:
# không cần span, không cần assertion. Đủ để phát hiện một thay đổi ở
# `normalize/` hay ở enrichment có làm retrieval tốt lên hay xấu đi.
#
# ── Cách gán mã vàng, và giới hạn của nó ────────────────────────────────
# Mã vàng gán từ kiến thức ICD-10/RxNorm, rồi VERIFY bằng `lookup(vocab, code)`
# — tức tra theo MÃ để đối chiếu tên chính thức, KHÔNG dùng `search_lexical`.
# Nếu gán bằng cách lấy top-1 của chính bộ truy hồi đang đo thì phép đo thành
# vòng lặp tự khen và vô giá trị.
#
# Dù vậy đây vẫn là nhãn do máy đề xuất: **cần một lượt duyệt của người có
# chuyên môn** trước khi coi các con số là chuẩn tuyệt đối. Với mục đích hiện
# tại — đo *delta* giữa hai lần build — nó đã đủ dùng.
#
# `gold` là DANH SÁCH: nhiều mention hợp lệ với vài mã (ICD có mã 3 ký tự và
# mã con; "đái tháo đường" không nói rõ típ thì E14/E11/E10 đều chấp nhận được).
# `hard: true` đánh dấu ca mà mention khác xa tên chuẩn — đây là nhóm mà
# enrichment ở Phase 3 phải cải thiện được.
#
# Mention lấy từ `data/test/` (đã đếm tần suất) và từ ví dụ trong PRD.

