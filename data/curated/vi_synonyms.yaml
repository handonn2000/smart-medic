# E5 — Từ đồng nghĩa dân dã, viết tắt và biến thể chính tả tiếng Việt.
#
# ★ File này được SINH MỘT LẦN rồi ĐÓNG BĂNG và commit vào git.
#   Pha `enrich` chỉ ĐỌC file tĩnh này, **không gọi LLM lúc build**. Gọi API lúc
#   build sẽ phá mục tiêu G2 (tái lập được) và vi phạm cảnh báo của PRD §8:
#   BTC cài lại không được là loại.
#
# Mọi term sinh từ đây mang `tier='generated'` nên:
#   · lọc riêng được ở query time để đo đóng góp
#   · gỡ sạch bằng `DELETE FROM terms WHERE tier != 'authoritative'`
#
# ── Vì sao cần ──
# Baseline Phase 2 có 7 ca trượt khỏi top-20, tất cả cùng một nguyên nhân:
# mention KHÔNG có token nào chung với tên ICD chuẩn.
#     "tiểu đường"  vs  "Đái tháo đường"
#     "ung thư"     vs  "U ác tính"
#     THA / ĐTĐ / COPD / GERD  — không xuất hiện trong tên
# BM25 không thể cứu lớp này dù chỉnh trọng số thế nào.
#
# ── Giới hạn ──
# Đây là tri thức do máy đề xuất. Cần bác sĩ/chuyên viên mã hoá duyệt trước khi
# tin tuyệt đối. Mọi mã đều đã verify tồn tại trong KB bằng `lookup`.

