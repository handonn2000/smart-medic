# ── THUỐC · vitamins ─────────────────────────────────────────────────────────
# 4 missed spans. RxNorm has "cyanocobalamin", not "B12" — the form a patient
# writes. Kept separate from drug_classes so the two counts stay auditable.
vitamins:
  - vitamin
  - vitamin a
  - vitamin b
  - vitamin b1
  - vitamin b6
  - vitamin b12
  - vitamin c
  - vitamin d
  - vitamin e
  - vitamin k
  - vitamin 3b
  - b12
  - canxi
  - calci
  - sắt
  - kẽm
  - acid folic
  - axit folic
  - omega 3

