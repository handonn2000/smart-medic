# L0 · resources/lab_patterns.yaml — luật dòng xét nghiệm. NGƯỜI viết, người review.
#
# Đọc bởi: src/smart_medic/extract/labvalues.py (P1)
#
# VÌ SAO FILE NÀY ĐÁNG CÓ
# 41,7% entity của gold (3.098/7.435) là hai loại xét nghiệm — TÊN_XÉT_NGHIỆM
# 23,5% và KẾT_QUẢ_XÉT_NGHIỆM 18,2%. Bỏ hẳn hai loại này tốn 56,42 và 60,41 điểm.
# Và 94/100 file test có dòng dạng `TÊN: giá trị`. Đây là recall RẺ NHẤT trong bài.
#
# Các mẫu này sẽ được chỉnh hàng chục lần. Nằm ở YAML thì một bác sĩ đọc được và
# sửa được mà không chạm vào Python; nằm trong code thì mỗi lần chỉnh là một diff
# phải review bởi người đọc được Python.
#
# ĐO ĐƯỢC TRÊN 162 FILE GOLD (1.350 KẾT_QUẢ_XÉT_NGHIỆM), căn cứ của mọi luật dưới:
#   · 1.343/1.350 (99,5%) có một TÊN_XÉT_NGHIỆM đứng TRƯỚC nó trong cùng tài liệu
#   · khoảng cách tên→giá trị: 1 ký tự 778 lần · 2 ký tự 253 · ≤2 ký tự = 76,3%
#   · phân cách hay gặp nhất: ' ' (771) · ': ' (240) · ' là ' (14) · ', ' (10)
#   · hình dạng giá trị: số thuần 753 · tỷ số kiểu 159/49 là 77 · phần trăm 28 ·
#     còn lại là từ định tính ('bình thường' 43, 'âm tính' 20, 'tăng' 14, …)
version: 1

# ─────────────────────────────────────────────────────────────────────────────
# 1 · NGỮ PHÁP GIÁ TRỊ — KẾT_QUẢ_XÉT_NGHIỆM
#
# Thứ tự trong `value_order` là thứ tự THỬ, dài trước ngắn. `numeric` phải ở CUỐI:
# nếu thử trước thì `159/49` chỉ ra `159`, và `98%` chỉ ra `98`.
#
# ⚠ DẤU PHẨY THẬP PHÂN. `Chol: 4,7 mmol/l` — `numeric` phải nuốt cả `,7`. Tách
# theo `,` biến MỘT kết quả thành HAI span rác; sai ranh giới tốn 6,95 điểm.
# ─────────────────────────────────────────────────────────────────────────────
value_patterns:
  # '< 0,5' · '>=10' · '≤ 2.0'
  comparator: '[<>]=?|[≤≥]'
  # '159/49' huyết áp · '20%-25%'
  ratio: '\d+(?:[.,]\d+)?[ \t]*[/\-–][ \t]*\d+(?:[.,]\d+)?'
  # '98%' · '20 %'
  percent: '\d+(?:[.,]\d+)?[ \t]*%'
  # 'protein 2+' · '3+'
  graded: '\d[+-]'
  # '4,7' · '227.0' · '12' — dấu phẩy VÀ dấu chấm đều là dấu thập phân
  numeric: '\d+(?:[.,]\d+)*'
value_order: [ratio, percent, graded, numeric]

# Giá trị định tính. Dài trước ngắn khi so khớp ('tăng cao' trước 'tăng'), việc đó
# do code sắp; danh sách này chỉ cần đọc được.
qualitative_results:
  - bình thường
  - trong giới hạn bình thường
  - trong giới hạn
  - không có bất thường
  - không bất thường
  - bất thường
  - âm tính
  - dương tính
  - tăng cao
  - tăng nhẹ
  - tăng
  - giảm nhẹ
  - giảm
  - rất cao
  - hơi cao
  - cao
  - thấp
  - ổn định
  - nguyên vẹn
  - đều
  - không đều
  - nhịp xoang
  - vết
  - sạch
  - rõ
  - trong

# ─────────────────────────────────────────────────────────────────────────────
# 2 · TỪ TÊN SANG GIÁ TRỊ
#
# `separator` là TOÀN BỘ những gì được phép nằm giữa tên và giá trị. Nó phải
# fullmatch — không phải search — nên một dấu chấm hay một tên khác chen vào là
# đủ để KHÔNG phát. Đo được: 76,3% khoảng cách là ≤2 ký tự, nên cửa sổ hẹp.
# ─────────────────────────────────────────────────────────────────────────────
separator: '[ \t]*(?::|=|là|đạt|ở mức|mức|khoảng|:[ \t]*khoảng)?[ \t]*'
separator_max_chars: 12

# 'H&H 30 va 39' → HAI kết quả. `và` viết sai thành `va` có thật trong corpus.
continuation: '[ \t]*(?:và|va|&|,|/|hoặc)[ \t]*'
max_continuations: 3

# Đơn vị đi SAU giá trị và KHÔNG thuộc span (đo được: 753/1.350 kết quả là số
# thuần, chỉ một nhúm gồm cả đơn vị). Danh sách này dùng để XÁC NHẬN rằng một
# giá trị trong dòng `TÊN: giá trị` thật sự là một phép đo, không phải để mở rộng
# span.
units:
  - mmol/l
  - mmol/L
  - mg/dl
  - mg/dL
  - mg/L
  - mg
  - g/dl
  - g/dL
  - g/L
  - g
  - mcg
  - µg
  - ug
  - micromol/l
  - µmol/L
  - umol/L
  - ng/ml
  - ng/mL
  - pg/ml
  - IU/L
  - U/L
  - mEq/L
  - mmHg
  - cmH2O
  - kg
  - g/kg
  - cm
  - mm
  - ml
  - mL
  - l
  - '%'
  - lần/phút
  - nhịp/phút
  - lần/ph
  - bpm
  - độ C
  - °C
  - giây
  - phút
  - giờ
  - tuần
  - K/uL
  - x10^9/L
  - '10^3/uL'

# ─────────────────────────────────────────────────────────────────────────────
# 3 · TÊN XÉT NGHIỆM
#
# Phần lớn tên xét nghiệm đến từ `data/artifacts/gazetteer.json` (khai thác từ
# corpus bạc synthetic + translated). Đo được: chỉ mục đó phủ 74,5% surface form
# TÊN_XÉT_NGHIỆM của gold. Phần thiếu gần như TOÀN BỘ là DẤU SINH TỒN — không phải
# vì chúng hiếm mà vì chúng là kiến thức phổ thông, không ai đi gán nhãn để dạy.
# Bổ sung bằng tay ở đây đưa trần phủ lên ~0,90.
#
# `names` khớp KHÔNG phân biệt hoa thường, và chỉ ở biên từ.
names:
  # dấu sinh tồn — 5 dòng đầu bù 152/445 surface form gold còn thiếu
  - huyết áp
  - nhịp tim
  - nhịp thở
